<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>완료 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../draft-common.css">
    <style>
        .done-hero {
            text-align: center;
            padding: 32px 20px;
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-radius: 14px;
        }
        .done-icon {
            font-size: 64px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .done-title {
            font-size: 22px;
            font-weight: 800;
            color: #065f46;
            margin-bottom: 6px;
        }
        .done-subtitle {
            font-size: 14px;
            color: #047857;
        }

        /* 진영 표시 */
        .side-display {
            margin-top: 16px;
        }
        .side-display .teams-display {
            margin-top: 0;
        }
        .team-box.is-blue {
            background: linear-gradient(135deg, #dbeafe, #bfdbfe);
            border-color: #3b82f6;
        }
        .team-box.is-blue .team-title { color: #1e40af; }
        .team-box.is-red {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-color: #ef4444;
        }
        .team-box.is-red .team-title { color: #991b1b; }
        .side-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .side-badge.blue {
            background: #1e40af;
            color: #fff;
        }
        .side-badge.red {
            background: #991b1b;
            color: #fff;
        }
        .next-step-info {
            margin-top: 16px;
            padding: 16px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #78350f;
        }
        .next-step-info .step-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div id="headerArea"></div>

        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">결과 불러오는 중...</div>
        </div>

        <div id="doneView" style="display:none;">
            <div class="card">
                <div class="done-hero">
                    <div class="done-icon">🎉</div>
                    <div class="done-title">드래프트 완료!</div>
                    <div class="done-subtitle" id="doneSubtitle">팀 구성 + 진영이 결정되었습니다</div>
                </div>
            </div>

            <!-- 최종 팀 -->
            <div class="card">
                <h2 style="font-size:16px; margin-bottom:12px;">🏆 최종 팀 구성</h2>
                <div id="finalTeamsDisplay" class="teams-display side-display"></div>
            </div>

            <!-- 단계 F 추가: 나가기 버튼 -->
            <div class="card" style="text-align:center;">
                <button class="btn" style="width:100%; padding:14px;" onclick="onExit()">👋 나가기</button>
                <div style="font-size:12px; color: var(--text-muted); margin-top:8px;">
                    드래프트가 완료되었습니다. 수고하셨습니다!
                </div>
            </div>

            <!-- 단계 C: "관리자 룰 설명을 기다려주세요" 안내 카드 제거됨 -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../draft-common.js"></script>

    <script>
    let currentRoom = null;
    let currentDrafts = [];

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 단계 O: N팀 모드면 teams 캐시 미리 로드
        if (currentRoom.team_count && currentRoom.team_count > 0) {
            try {
                const _c = initSupabase();
                const { data: _teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                if (_teams) setTeamsCache(_teams);
            } catch (e) { console.warn('teams load failed:', e); }
        }

        // 단계 L: 팀장 잠금 — "본인이 맞으십니까?" 확인 + claim
        const claimed = await ensureLeaderClaim(currentRoom);
        if (!claimed) return;  // 거부 시 ensureLeaderClaim이 화면 교체함

        if (currentRoom.status !== 'done') {
            goToMain();
            return;
        }

        currentDrafts = await loadDrafts();

        renderHeader(currentRoom,
            '🎉 STEP 5: 완료',
            '게임 준비 완료!'
        );

        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    // 단계 G: admin이 정상적으로 방을 정리한 경우 (드래프트 완료 후)
                    document.body.innerHTML = `
                        <div class="page-wrap" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
                            <div class="card" style="text-align:center; padding:40px 32px;">
                                <div style="font-size:64px; margin-bottom:12px;">🎉</div>
                                <h1 style="border-bottom:none; padding-bottom:0; margin-bottom:8px;">수고하셨습니다!</h1>
                                <p style="font-size:13px; color:var(--text-muted);">
                                    드래프트가 완료되었습니다.<br>
                                    이 창은 닫으셔도 됩니다.
                                </p>
                            </div>
                        </div>
                    `;
                    return;
                }
                currentRoom = payload.new;
                // 혹시 status가 다시 바뀌면 메인으로
                if (currentRoom.status !== 'done') {
                    goToMain();
                }
            }
        });

        hide('loadingView');
        show('doneView');
        renderDone();
    })();

    async function renderDone() {
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            return renderDone2();
        }
        return renderDoneN();
    }

    function renderDone2() {
        // 팀 구성
        const team1Members = [currentRoom.leader1_name || '(미정)'];
        const team2Members = [currentRoom.leader2_name || '(미정)'];

        currentDrafts.forEach(d => {
            if (d.picker === 'leader1') team1Members.push(d.picked_member);
            else if (d.picker === 'leader2') team2Members.push(d.picked_member);
        });

        // 진영
        const blueSide = currentRoom.blue_side; // 'leader1' or 'leader2'
        const team1IsBlue = blueSide === 'leader1';
        const team2IsBlue = blueSide === 'leader2';

        const team1Class = team1IsBlue ? 'is-blue' : 'is-red';
        const team2Class = team2IsBlue ? 'is-blue' : 'is-red';
        const team1Badge = team1IsBlue
            ? '<span class="side-badge blue">🟦 BLUE</span>'
            : '<span class="side-badge red">🟥 RED</span>';
        const team2Badge = team2IsBlue
            ? '<span class="side-badge blue">🟦 BLUE</span>'
            : '<span class="side-badge red">🟥 RED</span>';

        // 서브타이틀
        const blueTeamLabel = blueSide === 'leader1' ? '1팀' : '2팀';
        const redTeamLabel = blueSide === 'leader1' ? '2팀' : '1팀';
        $('doneSubtitle').innerText = `🟦 블루: ${blueTeamLabel}  |  🟥 레드: ${redTeamLabel}`;

        // 단계 I: 점수 lookup + 팀장 점수
        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        const roleMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) {
                scoreMap[m.name] = m.score;
                if (m.role !== undefined && m.role !== null) roleMap[m.name] = m.role;
            }
        });
        scoreMap[currentRoom.leader1_name] = currentRoom.leader1_score;
        scoreMap[currentRoom.leader2_name] = currentRoom.leader2_score;

        // 단계 P-3: 라인고정 모드 감지
        const isLineFixed = members.length > 0 && members[0] && members[0].role !== undefined && members[0].role !== null;
        const _LINE_LABELS = ['탑', '정글', '미드', '원딜', '서폿'];

        const scoreBadgeHtml = (name) => {
            const sc = scoreMap[name];
            return (sc !== null && sc !== undefined && sc !== '')
                ? `<span class="member-score-badge">${sc}</span>` : '';
        };

        // 단계 P-3: 라인고정 모드 — 라인 순서대로 정렬
        const sortByLine = (memberArr) => {
            if (!isLineFixed) return memberArr;
            return memberArr.slice().sort((a, b) => {
                const ra = roleMap[a] !== undefined ? roleMap[a] : 99;
                const rb = roleMap[b] !== undefined ? roleMap[b] : 99;
                return ra - rb;
            });
        };

        const sortedTeam1 = sortByLine(team1Members);
        const sortedTeam2 = sortByLine(team2Members);

        // 팀 합산 점수
        const team1Total = sortedTeam1.reduce((sum, n) => {
            const s = scoreMap[n];
            return sum + (typeof s === 'number' ? s : 0);
        }, 0);
        const team2Total = sortedTeam2.reduce((sum, n) => {
            const s = scoreMap[n];
            return sum + (typeof s === 'number' ? s : 0);
        }, 0);

        // 멤버 행 렌더 — 라인고정 모드면 라인 라벨 prefix
        const renderMemberRow = (m, isLeader) => {
            const linePrefix = isLineFixed && roleMap[m] !== undefined
                ? `<span style="font-size:11px; color:#4338ca; font-weight:800; min-width:32px; display:inline-block;">${_LINE_LABELS[roleMap[m]]}</span> `
                : '';
            return `<div class="team-member${isLeader?' leader':''}">${linePrefix}<span>${escapeHtml(m)}</span>${scoreBadgeHtml(m)}</div>`;
        };

        $('finalTeamsDisplay').innerHTML = `
            <div class="team-box team1 ${team1Class}">
                <div class="team-title">🏆 1팀 ${team1Badge} <span class="team-total">합산 ${team1Total}점</span></div>
                ${sortedTeam1.map((m, i) => renderMemberRow(m, m === currentRoom.leader1_name)).join('')}
            </div>
            <div class="team-box team2 ${team2Class}">
                <div class="team-title">🏆 2팀 ${team2Badge} <span class="team-total">합산 ${team2Total}점</span></div>
                ${sortedTeam2.map((m, i) => renderMemberRow(m, m === currentRoom.leader2_name)).join('')}
            </div>
        `;

        // 단계 P-3: admin으로 BroadcastChannel — 라인고정이면 role 정보 함께
        try {
            const bc = new BroadcastChannel('loldabang_draft');
            const buildTeamData = (membersList, leaderName, leaderScore) => {
                const leaderRole = isLineFixed ? roleMap[leaderName] : null;
                const memberItems = membersList
                    .filter(n => n !== leaderName)
                    .map(n => ({ name: n, score: scoreMap[n], role: isLineFixed ? roleMap[n] : null }));
                return {
                    leaderName: leaderName,
                    leaderScore: leaderScore,
                    leaderRole: leaderRole,
                    members: memberItems
                };
            };
            bc.postMessage({
                type: 'final_teams',
                team1: buildTeamData(sortedTeam1, currentRoom.leader1_name, currentRoom.leader1_score),
                team2: buildTeamData(sortedTeam2, currentRoom.leader2_name, currentRoom.leader2_score)
            });
        } catch (e) { console.warn('broadcast failed:', e); }
    }

    async function renderDoneN() {
        // teams + matchups 로드
        const client = initSupabase();
        let teams = [], matchups = [];
        try {
            const { data: ts } = await client.from('teams').select('*')
                .eq('room_code', ROOM_CODE).order('team_index');
            teams = ts || [];
            const { data: ms } = await client.from('matchups').select('*')
                .eq('room_code', ROOM_CODE).order('match_index');
            matchups = ms || [];
        } catch (e) {
            console.warn('teams/matchups load:', e);
        }

        // 점수 맵
        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) scoreMap[m.name] = m.score;
        });
        teams.forEach(t => { if (t.leader_name) scoreMap[t.leader_name] = t.leader_score; });

        const scoreBadgeHtml = (name) => {
            const sc = scoreMap[name];
            return (sc !== null && sc !== undefined && sc !== '')
                ? `<span class="member-score-badge">${sc}</span>` : '';
        };

        // 서브타이틀: 모든 매칭 요약
        const summaryParts = matchups.map(m => {
            const blueT = teams.find(t => t.team_index === m.blue_team_index);
            const redIdx = m.blue_team_index === m.team_a_index ? m.team_b_index : m.team_a_index;
            const redT = teams.find(t => t.team_index === redIdx);
            return `매칭 ${m.match_index}: 🟦${blueT ? blueT.team_index : '?'}팀 vs 🟥${redT ? redT.team_index : '?'}팀`;
        });
        $('doneSubtitle').innerText = summaryParts.join('  |  ') || `${teams.length}팀 드래프트 완료`;

        // 각 매칭을 그룹으로 표시
        const renderTeamBox = (team, sideLabel, isBlue) => {
            const picks = currentDrafts.filter(d => d.picker_team_index === team.team_index)
                                       .sort((a, b) => a.pick_number - b.pick_number);
            const list = [team.leader_name, ...picks.map(p => p.picked_member)];
            const total = list.reduce((s, n) => {
                const sc = scoreMap[n];
                return s + (typeof sc === 'number' ? sc : 0);
            }, 0);
            const cls = isBlue ? 'is-blue' : 'is-red';
            const badge = isBlue
                ? '<span class="side-badge blue">🟦 BLUE</span>'
                : '<span class="side-badge red">🟥 RED</span>';
            return `
                <div class="team-box ${cls}" style="border-radius:10px;">
                    <div class="team-title">🏆 ${team.team_index}팀 ${badge} <span class="team-total">합산 ${total}점</span></div>
                    ${list.map((n, i) => `<div class="team-member${i===0?' leader':''}"><span>${escapeHtml(n)}</span>${scoreBadgeHtml(n)}</div>`).join('')}
                </div>
            `;
        };

        let html = '';
        matchups.forEach(m => {
            const teamA = teams.find(t => t.team_index === m.team_a_index);
            const teamB = teams.find(t => t.team_index === m.team_b_index);
            if (!teamA || !teamB) return;
            // 단계 O-3 (fix #5): BLUE 항상 왼쪽, RED 항상 오른쪽
            const blueTeam = teams.find(t => t.team_index === m.blue_team_index);
            const redTeam = teamA.team_index === m.blue_team_index ? teamB : teamA;
            const leftTeam = blueTeam || teamA;
            const rightTeam = redTeam || teamB;
            html += `
                <div style="margin-bottom:18px;">
                    <div style="font-size:14px; font-weight:800; color:#1f2937; margin-bottom:8px; text-align:center;">
                        🥊 매칭 ${m.match_index}: ${leftTeam.team_index}팀 vs ${rightTeam.team_index}팀
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        ${renderTeamBox(leftTeam, '', true)}
                        ${renderTeamBox(rightTeam, '', false)}
                    </div>
                </div>
            `;
        });

        $('finalTeamsDisplay').innerHTML = html || '<p style="text-align:center; color:#6b7280;">매칭 정보를 불러올 수 없습니다.</p>';
    }

    // 단계 F 추가: 나가기 — 페이지 컨텐츠를 작별 메시지로 교체
    function onExit() {
        // 일부 브라우저는 스크립트로 직접 연 창이 아니면 window.close()가 안 됨
        // 안전하게: 페이지 컨텐츠를 작별 메시지로 교체
        document.body.innerHTML = `
            <div class="page-wrap" style="display:flex; align-items:center; justify-content:center; min-height:80vh;">
                <div class="card" style="text-align:center; padding:40px 32px;">
                    <div style="font-size:64px; margin-bottom:12px;">👋</div>
                    <h1 style="border-bottom:none; padding-bottom:0; margin-bottom:8px;">수고하셨습니다!</h1>
                    <p style="font-size:13px; color:var(--text-muted);">
                        이 창은 닫으셔도 됩니다.
                    </p>
                </div>
            </div>
        `;
        // 그래도 시도해보기
        try { window.close(); } catch(e) {}
    }
    </script>
</body>
</html>
