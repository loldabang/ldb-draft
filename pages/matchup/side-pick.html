<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진영 선택 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        .side-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .side-btn {
            padding: 40px 16px;
            border-radius: 14px;
            border: 3px solid;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Pretendard', sans-serif;
            text-align: center;
        }
        .side-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .side-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .side-btn.blue {
            background: linear-gradient(135deg, #dbeafe, #93c5fd);
            border-color: #3b82f6;
            color: #1e40af;
        }
        .side-btn.blue:hover:not(:disabled) {
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
        }
        .side-btn.red {
            background: linear-gradient(135deg, #fee2e2, #fca5a5);
            border-color: #ef4444;
            color: #991b1b;
        }
        .side-btn.red:hover:not(:disabled) {
            background: linear-gradient(135deg, #fecaca, #f87171);
        }
        .side-icon {
            font-size: 56px;
            margin-bottom: 12px;
            line-height: 1;
        }
        .side-label {
            font-size: 20px;
            font-weight: 800;
        }
        .side-desc {
            font-size: 12px;
            margin-top: 6px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div id="headerArea"></div>

        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">방 정보 불러오는 중...</div>
        </div>

        <div id="sideView" class="card" style="display:none;">
            <div class="status-box success" style="margin-bottom:8px;">
                <div class="status-icon">🏆</div>
                <div class="status-title">가위바위보 승리!</div>
                <div class="status-desc">진영을 선택해주세요.</div>
            </div>

            <h2 style="margin-top:20px;">🎮 진영 선택</h2>
            <p style="text-align:center;">블루(파란색) 진영과 레드(빨간색) 진영 중 선택하세요.</p>

            <div class="side-grid">
                <button class="side-btn blue" onclick="onChooseSide(true)">
                    <div class="side-icon">🟦</div>
                    <div class="side-label">1팀(블루)</div>
                    <div class="side-desc">내 팀을 1팀 위치, 블루 진영으로</div>
                </button>
                <button class="side-btn red" onclick="onChooseSide(false)">
                    <div class="side-icon">🟥</div>
                    <div class="side-label">2팀(레드)</div>
                    <div class="side-desc">내 팀을 2팀 위치, 레드 진영으로</div>
                </button>
            </div>
        </div>

        <div id="alreadyView" class="card" style="display:none;">
            <div class="status-box waiting">
                <div class="status-icon">⏳</div>
                <div class="status-title">잠시만 기다려주세요</div>
                <div class="status-desc">진영 선택이 처리되는 중입니다...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    let currentRoom = null;
    let isProcessing = false;

    // 단계 O-2 N팀 전용
    let _myMatchup = null;        // 본인이 속한 매칭 row
    let _myMatchupRps = null;     // 본인 매칭의 rps_games row
    let _myRole = null;           // 'a' 또는 'b' (매칭 안에서 본인이 team_a인지 b인지)
    let _myTeamIndex = null;
    let _sideRpsChannel = null;
    let currentDrafts = [];        // 단계 O-3: 매칭 양 팀 멤버 표시용
    let _memberScoreMap = {};      // 단계 O-3: 점수 lookup

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 단계 O: N팀 모드면 teams 캐시 미리 로드
        if (currentRoom.team_count && currentRoom.team_count > 0) {
            try {
                const _c = initSupabase();
                const { data: _teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                if (_teams) setTeamsCache(_teams);
            } catch (e) { console.warn('teams load failed:', e); }
        }

        // 단계 L: 팀장 잠금
        const claimed = await ensureLeaderClaim(currentRoom);
        if (!claimed) return;

        const teamCount = currentRoom.team_count || 2;
        _myTeamIndex = getMyTeamIndex();

        if (teamCount === 2) {
            // ─── 기존 2팀 흐름 ─────────────────────────────────
            const rpsGames = await loadRpsGames();
            const rps2 = rpsGames.find(g => g.round === 2);
            const validStatus = currentRoom.status === 'rps2';
            const isWinner = rps2 && rps2.winner && rps2.winner === ROLE;

            if (!validStatus || !isWinner) {
                goToMain();
                return;
            }

            renderHeader(currentRoom,
                '🏆 STEP 4: 진영 선택',
                '블루/레드 진영을 선택하세요.'
            );

            subscribeRealtime({
                onRoom: (payload) => {
                    if (payload.eventType === 'DELETE') {
                        showFatalError('관리자가 방을 닫았습니다.');
                        return;
                    }
                    currentRoom = payload.new;
                    if (currentRoom.status === 'done') {
                        goToDone();
                    }
                }
            });

            hide('loadingView');
            show('sideView');
            return;
        }

        // ─── 단계 O-2: N팀 매칭 진영 가위바위보 ─────────────────
        if (currentRoom.status !== 'side_rps' && currentRoom.status !== 'done') {
            // 다른 단계라면 main으로
            goToMain();
            return;
        }
        await _initNTeamSidePick();
    })();

    // ============================================================================
    // 단계 O-2: N팀 매칭 진영 가위바위보 + 진영 선택
    // ============================================================================
    async function _initNTeamSidePick() {
        renderHeader(currentRoom,
            '🥊 STEP 3: 진영 가위바위보',
            '본인 매칭의 가위바위보를 진행하세요.'
        );

        // 단계 O-3 (fix #5): drafts + score 맵 준비
        currentDrafts = await loadDrafts();
        _memberScoreMap = {};
        const mems = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        mems.forEach(m => {
            if (m && typeof m === 'object' && m.name) _memberScoreMap[m.name] = m.score;
        });
        // teams 캐시에서 팀장 점수도 추가
        try {
            const cTeams = window._teamsCache; // setTeamsCache로 저장된 캐시 접근
            // _teamsCache가 외부 변수라 접근 안 될 수 있음. fallback으로 fetch.
        } catch (e) {}

        const ok = await _loadMyMatchup();
        if (!ok) {
            showFatalError('본인이 속한 매칭을 찾을 수 없습니다.');
            return;
        }

        // teams 캐시에서 점수 보강
        try {
            const client = initSupabase();
            const { data: teams } = await client.from('teams').select('leader_name, leader_score')
                .eq('room_code', ROOM_CODE);
            if (teams) teams.forEach(t => { if (t.leader_name) _memberScoreMap[t.leader_name] = t.leader_score; });
        } catch (e) {}

        // 실시간 구독
        const client = initSupabase();
        _sideRpsChannel = client.channel('side_rps_' + ROOM_CODE)
            .on('postgres_changes', {
                event: '*', schema: 'public', table: 'matchups',
                filter: `room_code=eq.${ROOM_CODE}`
            }, async (payload) => {
                if (payload.new && payload.new.id === (_myMatchup && _myMatchup.id)) {
                    _myMatchup = payload.new;
                    renderNTeamSidePick();
                }
            })
            .on('postgres_changes', {
                event: '*', schema: 'public', table: 'rps_games',
                filter: `room_code=eq.${ROOM_CODE}`
            }, (payload) => {
                if (payload.new && _myMatchup && payload.new.matchup_id === _myMatchup.id) {
                    _myMatchupRps = payload.new;
                    renderNTeamSidePick();
                }
            })
            .on('postgres_changes', {
                event: '*', schema: 'public', table: 'rooms',
                filter: `room_code=eq.${ROOM_CODE}`
            }, (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                if (currentRoom.status === 'done') {
                    goToDone();
                }
            })
            .subscribe();

        hide('loadingView');
        renderNTeamSidePick();
    }

    async function _loadMyMatchup() {
        const client = initSupabase();
        try {
            const { data: matchups } = await client
                .from('matchups')
                .select('*')
                .eq('room_code', ROOM_CODE);
            if (!matchups) return false;
            _myMatchup = matchups.find(m =>
                m.team_a_index === _myTeamIndex || m.team_b_index === _myTeamIndex
            );
            if (!_myMatchup) return false;
            _myRole = (_myMatchup.team_a_index === _myTeamIndex) ? 'a' : 'b';

            const { data: rps } = await client
                .from('rps_games')
                .select('*')
                .eq('matchup_id', _myMatchup.id)
                .maybeSingle();
            _myMatchupRps = rps || null;
            return true;
        } catch (e) {
            console.error('loadMyMatchup failed:', e);
            return false;
        }
    }

    // 단계 O-3 (fix #3): N팀 비김 효과 — 본인 매칭 카드 위에 인라인 표시
    //   (전체 오버레이가 아닌, 매칭 카드 영역에만 표시)
    let _lastDrawShown = -1;
    function _showDrawEffect(rpsId) {
        if (_lastDrawShown === rpsId) return;
        _lastDrawShown = rpsId;
        // 4초 후 lock 해제
        setTimeout(() => {
            if (_lastDrawShown === rpsId) _lastDrawShown = -1;
        }, 4000);

        // 매칭 카드 영역 안에 인라인 오버레이 띄우기
        const view = document.getElementById('sideView');
        if (!view) return;

        // 기존 인라인 오버레이 있으면 제거
        const oldOverlay = view.querySelector('.matchup-draw-overlay');
        if (oldOverlay) oldOverlay.remove();

        // view를 relative로 만들어서 absolute 자식 받기
        view.style.position = view.style.position || 'relative';

        const overlay = document.createElement('div');
        overlay.className = 'matchup-draw-overlay';
        overlay.style.cssText = 'position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(254, 243, 199, 0.92); border-radius:14px; z-index:50; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px); animation:drawFadeIn 0.3s ease-out; pointer-events:none;';
        overlay.innerHTML = `
            <div style="background:linear-gradient(135deg, #fef3c7, #fbbf24); border-radius:14px; padding:20px 30px; text-align:center; box-shadow:0 12px 36px rgba(245,158,11,0.5); animation:drawPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); border:3px solid #f59e0b;">
                <div style="font-size:48px; margin-bottom:4px; animation:drawShake 0.6s ease-out;">🤝</div>
                <div style="font-size:18px; font-weight:900; color:#92400e; margin-bottom:2px;">비김!</div>
                <div style="font-size:11px; color:#78350f; font-weight:700;">다시 가위바위보를 진행합니다</div>
            </div>
        `;
        if (!document.getElementById('drawEffectStyles')) {
            const st = document.createElement('style');
            st.id = 'drawEffectStyles';
            st.innerText = `
                @keyframes drawFadeIn { from { opacity:0; } to { opacity:1; } }
                @keyframes drawPop { 0% { transform:scale(0.3); opacity:0; } 50% { transform:scale(1.1); } 100% { transform:scale(1); opacity:1; } }
                @keyframes drawShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
                @keyframes drawFadeOut { to { opacity:0; transform:scale(0.9); } }
            `;
            document.head.appendChild(st);
        }
        view.appendChild(overlay);
        setTimeout(() => {
            overlay.style.animation = 'drawFadeOut 0.4s ease-in forwards';
            setTimeout(() => { try { overlay.remove(); } catch(e){} }, 400);
        }, 1800);
    }

    let _pendingRpsChoice = null;  // 단계 O-3 (fix #4): 확정 전 임시 선택

    function renderNTeamSidePick() {
        // sideView 자리에 동적 화면 렌더링
        const view = document.getElementById('sideView');
        if (!view) return;
        view.style.display = 'block';

        const teamA = getTeamByIndex(_myMatchup.team_a_index);
        const teamB = getTeamByIndex(_myMatchup.team_b_index);
        const myTeam = getTeamByIndex(_myTeamIndex);
        const oppTeamIdx = (_myTeamIndex === _myMatchup.team_a_index)
            ? _myMatchup.team_b_index : _myMatchup.team_a_index;
        const oppTeam = getTeamByIndex(oppTeamIdx);

        // 단계 O-3 (fix #5): 매칭 양 팀 멤버 로딩 (currentDrafts로부터)
        const buildTeamMemberList = (team) => {
            if (!team) return [];
            const picks = currentDrafts.filter(d => d.picker_team_index === team.team_index)
                                       .sort((a, b) => a.pick_number - b.pick_number);
            return [
                { name: team.leader_name, score: team.leader_score, isLeader: true },
                ...picks.map(p => ({ name: p.picked_member, score: _memberScoreMap[p.picked_member], isLeader: false }))
            ];
        };

        const renderMemberList = (members, isMine) => {
            const bgColor = isMine ? '#fef3c7' : '#fff';
            const borderColor = isMine ? '#fbbf24' : '#e5e7eb';
            const html = members.map(m => {
                const sc = (m.score !== null && m.score !== undefined && m.score !== '')
                    ? `<span style="background:linear-gradient(135deg, #6366f1, #4f46e5); color:#fff; border-radius:8px; padding:1px 6px; font-size:10px; font-weight:800;">${m.score}</span>`
                    : '';
                return `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 8px; background:${bgColor}; border-radius:6px; margin-bottom:2px; font-size:11px; ${m.isLeader ? 'font-weight:800;' : ''}">
                    <span>${m.isLeader ? '👑 ' : ''}${escapeHtml(m.name || '?')}</span>${sc}
                </div>`;
            }).join('');
            return `<div style="padding:6px; border:2px solid ${borderColor}; border-radius:8px; background:#f9fafb;">${html}</div>`;
        };

        const myMembers = buildTeamMemberList(myTeam);
        const oppMembers = buildTeamMemberList(oppTeam);

        // 진영 결정 완료
        if (_myMatchup.blue_team_index) {
            const blueTeam = getTeamByIndex(_myMatchup.blue_team_index);
            const redTeamIdx = _myMatchup.blue_team_index === _myMatchup.team_a_index
                ? _myMatchup.team_b_index : _myMatchup.team_a_index;
            const redTeam = getTeamByIndex(redTeamIdx);
            const iAmBlue = _myMatchup.blue_team_index === _myTeamIndex;
            // 단계 O-3 (fix #5): BLUE 항상 왼쪽, RED 항상 오른쪽
            const blueMembers = buildTeamMemberList(blueTeam);
            const redMembers = buildTeamMemberList(redTeam);
            const blueIsMine = blueTeam && blueTeam.team_index === _myTeamIndex;
            const redIsMine = !blueIsMine;
            view.innerHTML = `<div class="card" style="text-align:center; padding:20px 16px;">
                <div style="font-size:48px; margin-bottom:4px;">${iAmBlue ? '🟦' : '🟥'}</div>
                <h1 style="border-bottom:none; padding-bottom:0; font-size:18px;">매칭 ${_myMatchup.match_index} 진영 결정 완료!</h1>
                <p style="font-size:13px; margin:10px 0 14px;">
                    <strong>${blueTeam ? blueTeam.team_index : ''}팀 (${escapeHtml(blueTeam ? blueTeam.leader_name : '')})</strong>: 🟦 BLUE<br>
                    <strong>${redTeam ? redTeam.team_index : ''}팀 (${escapeHtml(redTeam ? redTeam.leader_name : '')})</strong>: 🟥 RED
                </p>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left; margin-top:12px;">
                    <div>
                        <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center; color:#1e40af;">
                            🟦 ${blueTeam ? blueTeam.team_index : ''}팀 BLUE${blueIsMine ? ' ⭐' : ''}
                        </div>
                        ${renderMemberList(blueMembers, blueIsMine)}
                    </div>
                    <div>
                        <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center; color:#991b1b;">
                            🟥 ${redTeam ? redTeam.team_index : ''}팀 RED${redIsMine ? ' ⭐' : ''}
                        </div>
                        ${renderMemberList(redMembers, redIsMine)}
                    </div>
                </div>
                <p style="color:#6b7280; font-size:11px; margin-top:14px;">다른 매칭이 끝날 때까지 기다려주세요...</p>
                <div class="spinner" style="margin:14px auto 0;"></div>
            </div>`;
            return;
        }

        const winner = _myMatchupRps ? _myMatchupRps.winner : null;
        const iWon = winner && (
            (winner === 'leader1' && _myRole === 'a') ||
            (winner === 'leader2' && _myRole === 'b')
        );
        const iLost = winner && winner !== 'draw' && !iWon;

        // 가위바위보 진행 중
        // 단계 O-3 (fix #1): SQL이 winner='draw' 즉시 reset해서 양 팀 모두에게 안 보일 수 있음
        //   → 양 선택값으로 클라이언트 판정 추가
        let isDraw = (winner === 'draw');
        if (!isDraw && _myMatchupRps
            && _myMatchupRps.leader1_choice && _myMatchupRps.leader2_choice
            && _myMatchupRps.leader1_choice === _myMatchupRps.leader2_choice
            && !_myMatchupRps.winner) {
            isDraw = true;
        }

        if (!winner || isDraw) {
            // 비김 시 _pendingRpsChoice도 reset + 큰 효과 1회
            if (isDraw) {
                _pendingRpsChoice = null;
                // 단계 O-3 (fix #2): unique key = rps_id + choices (양 선택이 같은 비김도 유니크)
                const drawKey = (_myMatchupRps ? _myMatchupRps.id : 'rps') + '-' + (_myMatchupRps.leader1_choice || '') + '-' + (_myMatchupRps.leader2_choice || '');
                _showDrawEffect(drawKey);
            }

            const myChoice = _myRole === 'a'
                ? (_myMatchupRps && _myMatchupRps.leader1_choice)
                : (_myMatchupRps && _myMatchupRps.leader2_choice);
            const oppChoice = _myRole === 'a'
                ? (_myMatchupRps && _myMatchupRps.leader2_choice)
                : (_myMatchupRps && _myMatchupRps.leader1_choice);
            const bothChosen = myChoice && oppChoice;
            // 단계 O-3 (fix #4): 내가 이미 확정한 상태면 변경 불가
            const submitted = !!myChoice;

            const emoji = ch => ({ rock: '✊', paper: '✋', scissors: '✌️' })[ch] || '';
            const korean = ch => ({ rock: '바위', paper: '보', scissors: '가위' })[ch] || '';

            const myChoiceHtml = myChoice
                ? `<div style="font-size:42px;">${emoji(myChoice)}</div><div style="font-size:12px; color:#6b7280;">${korean(myChoice)}</div>`
                : (_pendingRpsChoice
                    ? `<div style="font-size:42px;">${emoji(_pendingRpsChoice)}</div><div style="font-size:11px; color:#f59e0b; font-weight:700;">${korean(_pendingRpsChoice)} (확정 전)</div>`
                    : `<div style="font-size:18px; color:#9ca3af;">선택 대기</div>`);
            const oppChoiceHtml = oppChoice
                ? (bothChosen
                    ? `<div style="font-size:42px;">${emoji(oppChoice)}</div><div style="font-size:12px; color:#6b7280;">${korean(oppChoice)}</div>`
                    : `<div style="font-size:18px; color:#10b981; font-weight:800;">✅ 선택 완료</div>`)
                : `<div style="font-size:18px; color:#9ca3af;">선택 대기</div>`;

            view.innerHTML = `
                <div class="card" style="padding:16px;">
                    <div style="text-align:center; margin-bottom:12px;">
                        <h2 style="font-size:15px; margin-bottom:4px;">🥊 매칭 ${_myMatchup.match_index}</h2>
                        ${isDraw ? '<p style="color:#f59e0b; font-size:12px;">🤝 비김! 다시 시작합니다</p>' : '<p style="color:#6b7280; font-size:12px;">가위바위보로 진영 선택권을 정합니다</p>'}
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 40px 1fr; gap:8px; align-items:center; margin-bottom:14px;">
                        <div style="text-align:center; padding:10px; background:linear-gradient(135deg, #fef3c7, #fde68a); border:2px solid #fbbf24; border-radius:10px;">
                            <div style="font-size:12px; font-weight:800; margin-bottom:2px;">⭐ ${myTeam ? myTeam.team_index : ''}팀 (나)</div>
                            <div style="font-size:11px; color:#6b7280; margin-bottom:6px;">${escapeHtml(myTeam ? myTeam.leader_name : '')}</div>
                            ${myChoiceHtml}
                        </div>
                        <div style="text-align:center; font-size:18px; font-weight:900; color:#9ca3af;">VS</div>
                        <div style="text-align:center; padding:10px; background:linear-gradient(135deg, #dbeafe, #93c5fd); border:2px solid #60a5fa; border-radius:10px;">
                            <div style="font-size:12px; font-weight:800; margin-bottom:2px;">${oppTeam ? oppTeam.team_index : ''}팀</div>
                            <div style="font-size:11px; color:#6b7280; margin-bottom:6px;">${escapeHtml(oppTeam ? oppTeam.leader_name : '')}</div>
                            ${oppChoiceHtml}
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:10px;">
                        <button class="rps-choice-btn" data-choice="rock" type="button" ${submitted ? 'disabled' : ''}
                                style="padding:14px 6px; border:2px solid ${_pendingRpsChoice === 'rock' ? '#fbbf24' : '#e5e7eb'}; border-radius:10px; background:${_pendingRpsChoice === 'rock' ? '#fffbeb' : '#fff'}; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">
                            <div style="font-size:26px;">✊</div>바위
                        </button>
                        <button class="rps-choice-btn" data-choice="scissors" type="button" ${submitted ? 'disabled' : ''}
                                style="padding:14px 6px; border:2px solid ${_pendingRpsChoice === 'scissors' ? '#fbbf24' : '#e5e7eb'}; border-radius:10px; background:${_pendingRpsChoice === 'scissors' ? '#fffbeb' : '#fff'}; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">
                            <div style="font-size:26px;">✌️</div>가위
                        </button>
                        <button class="rps-choice-btn" data-choice="paper" type="button" ${submitted ? 'disabled' : ''}
                                style="padding:14px 6px; border:2px solid ${_pendingRpsChoice === 'paper' ? '#fbbf24' : '#e5e7eb'}; border-radius:10px; background:${_pendingRpsChoice === 'paper' ? '#fffbeb' : '#fff'}; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">
                            <div style="font-size:26px;">✋</div>보
                        </button>
                    </div>
                    <button id="rpsConfirmBtn" type="button" ${(!_pendingRpsChoice || submitted) ? 'disabled' : ''}
                            style="width:100%; padding:12px; border:none; border-radius:10px; font-family:inherit; font-weight:800; font-size:14px; cursor:${(!_pendingRpsChoice || submitted) ? 'not-allowed' : 'pointer'}; background:${(!_pendingRpsChoice || submitted) ? '#d1d5db' : 'linear-gradient(135deg, #10b981, #059669)'}; color:${(!_pendingRpsChoice || submitted) ? '#9ca3af' : '#fff'};">
                        ${submitted ? '✅ 확정됨 — 상대 대기 중' : (_pendingRpsChoice ? '✅ ' + korean(_pendingRpsChoice) + ' 확정' : '👆 가위/바위/보를 선택하세요')}
                    </button>
                </div>
            `;
            view.querySelectorAll('.rps-choice-btn').forEach(btn => {
                btn.onclick = () => {
                    _pendingRpsChoice = btn.dataset.choice;
                    renderNTeamSidePick();
                };
            });
            const confirmBtn = document.getElementById('rpsConfirmBtn');
            if (confirmBtn) {
                confirmBtn.onclick = () => {
                    if (!_pendingRpsChoice) return;
                    onMatchupRpsChoice(_pendingRpsChoice);
                };
            }
            return;
        }

        // 가위바위보 종료 — 승자/패자에 따라
        if (iWon) {
            // 진영 선택 화면 + 매칭 양 팀 멤버 표시
            view.innerHTML = `
                <div class="card" style="padding:18px;">
                    <div style="text-align:center; margin-bottom:12px;">
                        <div style="font-size:42px; margin-bottom:4px;">🏆</div>
                        <h2 style="font-size:17px; margin-bottom:4px;">매칭 ${_myMatchup.match_index} 승리!</h2>
                        <p style="font-size:12px; color:#6b7280;">진영을 선택해주세요.</p>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
                        <div>
                            <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center;">⭐ ${myTeam ? myTeam.team_index : ''}팀 (나)</div>
                            ${renderMemberList(myMembers, true)}
                        </div>
                        <div>
                            <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center;">${oppTeam ? oppTeam.team_index : ''}팀 (상대)</div>
                            ${renderMemberList(oppMembers, false)}
                        </div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <button class="side-btn blue" data-blue="1" type="button" style="padding:18px 8px;">
                            <div class="side-icon" style="font-size:36px;">🟦</div>
                            <div class="side-label" style="font-size:14px;">BLUE</div>
                            <div class="side-desc" style="font-size:11px;">내 팀을 블루 진영으로</div>
                        </button>
                        <button class="side-btn red" data-blue="0" type="button" style="padding:18px 8px;">
                            <div class="side-icon" style="font-size:36px;">🟥</div>
                            <div class="side-label" style="font-size:14px;">RED</div>
                            <div class="side-desc" style="font-size:11px;">내 팀을 레드 진영으로</div>
                        </button>
                    </div>
                </div>
            `;
            view.querySelectorAll('.side-btn').forEach(btn => {
                btn.onclick = () => onChooseMatchupSide(btn.dataset.blue === '1');
            });
        } else if (iLost) {
            // 패자 — 대기 화면 + 매칭 양 팀 멤버
            view.innerHTML = `
                <div class="card" style="padding:18px;">
                    <div style="text-align:center; margin-bottom:12px;">
                        <div style="font-size:42px; margin-bottom:4px;">⏳</div>
                        <h2 style="font-size:17px; margin-bottom:4px;">진영 선택 대기 중</h2>
                        <p style="font-size:12px; color:#6b7280;">
                            ${oppTeam ? oppTeam.team_index : ''}팀 (${escapeHtml(oppTeam ? oppTeam.leader_name : '')})이(가) 진영 선택 중입니다.
                        </p>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <div>
                            <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center;">⭐ ${myTeam ? myTeam.team_index : ''}팀 (나)</div>
                            ${renderMemberList(myMembers, true)}
                        </div>
                        <div>
                            <div style="font-size:12px; font-weight:800; margin-bottom:6px; text-align:center;">${oppTeam ? oppTeam.team_index : ''}팀 (상대)</div>
                            ${renderMemberList(oppMembers, false)}
                        </div>
                    </div>
                    <div class="spinner" style="margin:14px auto 0;"></div>
                </div>
            `;
        }
    }

    async function onMatchupRpsChoice(choice) {
        if (isProcessing) return;
        isProcessing = true;
        const client = initSupabase();
        try {
            const { data, error } = await client.rpc('make_matchup_rps_choice', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_matchup_id: _myMatchup.id,
                p_choice: choice
            });
            if (error) {
                showToast('오류: ' + error.message);
            } else if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '실패');
            } else {
                _pendingRpsChoice = null;  // 단계 O-3 (fix #4): 확정 성공 → 초기화
            }
        } catch (e) {
            console.error(e);
            showToast('네트워크 오류');
        }
        isProcessing = false;
    }

    async function onChooseMatchupSide(takeBlue) {
        if (isProcessing) return;
        isProcessing = true;
        document.querySelectorAll('.side-btn').forEach(b => b.disabled = true);
        const client = initSupabase();
        try {
            const { data, error } = await client.rpc('set_matchup_blue', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_matchup_id: _myMatchup.id,
                p_take_blue: takeBlue
            });
            if (error) {
                showToast('오류: ' + error.message);
                document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }
            if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '실패');
                document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }
            showToast(takeBlue ? '🟦 BLUE 진영 선택!' : '🟥 RED 진영 선택!');
        } catch (e) {
            console.error(e);
            showToast('네트워크 오류');
            document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
            isProcessing = false;
        }
    }

    // ============================================================================
    // 기존 2팀 흐름
    // ============================================================================
    async function onChooseSide(takeBlue) {
        if (isProcessing) return;
        isProcessing = true;

        document.querySelectorAll('.side-btn').forEach(b => b.disabled = true);

        try {
            const client = initSupabase();
            const { data, error } = await client.rpc('set_blue_side', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_take_blue: takeBlue
            });
            if (error) {
                showToast('오류: ' + error.message);
                document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }
            if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '실패');
                document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }

            showToast(takeBlue ? '블루 진영 선택!' : '레드 진영 선택!');
            hide('sideView');
            show('alreadyView');
            setTimeout(() => goToDone(), 1800);
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
            document.querySelectorAll('.side-btn').forEach(b => b.disabled = false);
            isProcessing = false;
        }
    }
    </script>
</body>
</html>
