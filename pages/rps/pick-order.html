<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽 순서 선택 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        body { align-items: flex-start; }
        .page-wrap { max-width: 1180px; }

        .section-title-2 {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        /* 픽 순서 선택 버튼 (3단 그리드 안에서는 세로로) */
        .order-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .order-btn {
            padding: 16px 10px;
            border: 3px solid var(--border);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Pretendard', sans-serif;
        }
        .order-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }
        .order-btn:disabled { cursor: not-allowed; opacity: 0.5; }
        .order-btn.first {
            border-color: var(--warning);
            background: linear-gradient(135deg, #fffaf3, #fff3e0);
        }
        .order-btn.first:hover:not(:disabled) {
            border-color: #ff6f00;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
        }
        .order-btn.last {
            border-color: var(--info);
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
        }
        .order-btn.last:hover:not(:disabled) {
            border-color: #0277bd;
            background: linear-gradient(135deg, #e0f2fe, #b3e5fc);
        }
        .order-icon { font-size: 28px; margin-bottom: 4px; line-height: 1; }
        .order-label { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .order-desc { font-size: 10px; color: var(--text-muted); line-height: 1.3; }

        .order-explanation {
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .order-explanation strong { color: var(--text-main); }
        .order-explanation .sequence {
            font-family: 'Pretendard', monospace;
            background: #fff;
            padding: 5px 8px;
            border-radius: 5px;
            margin-top: 5px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            letter-spacing: 1px;
            font-size: 11px;
        }

        /* 결과 배너 (이긴/진 분기) */
        .result-banner {
            text-align: center;
            padding: 18px 16px;
            border-radius: 12px;
        }
        .result-banner.win { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
        .result-banner.lose { background: linear-gradient(135deg, #f3f4f6, #e5e7eb); }
        .result-banner .result-icon { font-size: 36px; line-height: 1; margin-bottom: 6px; }
        .result-banner .result-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
        .result-banner.win .result-title { color: #065f46; }
        .result-banner.lose .result-title { color: var(--text-muted); }
        .result-banner .result-desc { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div id="headerArea"></div>

        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">방 정보 불러오는 중...</div>
        </div>

        <div id="orderView" style="display:none;">

            <!-- 결과 배너 -->
            <div class="card">
                <div id="resultBanner" class="result-banner">
                    <div class="result-icon" id="resultIcon">🏆</div>
                    <div class="result-title" id="resultTitle">로딩 중...</div>
                    <div class="result-desc" id="resultDesc"></div>
                </div>
            </div>

            <!-- 3단 그리드: 멤버 / 양 팀 / 픽 순서 컨트롤 -->
            <div class="triple-grid">
                <!-- 왼쪽: 드래프트 멤버 8명 -->
                <div class="card">
                    <div class="section-title-2">📋 드래프트 멤버 (<span id="memberCount">8</span>명)</div>
                    <div id="memberPreviewList" class="member-preview-list"></div>
                </div>

                <!-- 가운데: 내 팀 (위) / 상대 팀 (아래) -->
                <div class="split-grid-right">
                    <div class="card">
                        <div class="section-title-2"><span id="myTeamHeader">🏆 내 팀</span></div>
                        <div id="myTeamBox"></div>
                    </div>
                    <div class="card">
                        <div class="section-title-2"><span id="otherTeamHeader">🤝 상대 팀</span></div>
                        <div id="otherTeamBox"></div>
                    </div>
                </div>

                <!-- 오른쪽: 픽 순서 선택 (이긴 사람) 또는 대기 박스 (진 사람) -->
                <div>
                    <!-- 픽 순서 선택 (이긴 사람만) -->
                    <div class="card" id="pickOrderControls" style="display:none;">
                        <h2 style="margin-top:0; font-size:15px;">⚡ 픽 순서 선택</h2>
                        <p style="text-align:center; font-size:12px; margin-bottom:10px;">먼저 픽할지, 나중에 픽할지 선택하세요.</p>

                        <div class="order-grid">
                            <button class="order-btn first" onclick="onChoosePickOrder(true)">
                                <div class="order-icon">⚡</div>
                                <div class="order-label">먼저 픽</div>
                                <div class="order-desc">내가 1번째<br>픽으로 시작</div>
                            </button>
                            <button class="order-btn last" onclick="onChoosePickOrder(false)">
                                <div class="order-icon">🛡️</div>
                                <div class="order-label">나중 픽</div>
                                <div class="order-desc">상대가 먼저,<br>내가 마지막</div>
                            </button>
                        </div>

                        <div class="order-explanation">
                            <strong>📋 1-2-2-2-1 순서</strong>
                            <div class="sequence">A→BB→AA→BB→A</div>
                            <div style="margin-top:6px;">
                                총 8픽. "먼저 픽(A)"이 1번과 마지막,<br>중간은 2명씩 번갈아 픽합니다.
                            </div>
                        </div>
                    </div>

                    <!-- 진 사람 대기 화면 -->
                    <div class="card" id="loserWaiting" style="display:none;">
                        <div class="status-box waiting" style="margin-top:0;">
                            <div class="status-icon">⏳</div>
                            <div class="status-title" style="font-size:14px;">상대 팀장이<br>픽 순서를 선택 중...</div>
                            <div class="status-desc" style="font-size:12px; margin-top:6px;">결정되면 자동으로<br>다음 단계로 진행됩니다.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 처리 중 (이긴 사람이 픽 순서 선택 후) -->
        <div id="alreadyView" class="card" style="display:none;">
            <div class="status-box waiting">
                <div class="status-icon">⏳</div>
                <div class="status-title">잠시만 기다려주세요</div>
                <div class="status-desc">픽 순서가 처리되는 중입니다...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // pick-order.html (단계 E: 이긴 사람 + 진 사람 모두 진입, 진 사람은 read-only)
    // ========================================================================

    let currentRoom = null;
    let isProcessing = false;
    let isWinner = false;

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 1차 가위바위보 결과 확인
        const rpsGames = await loadRpsGames();
        const rps1 = rpsGames.find(g => g.round === 1);

        const validStatus = currentRoom.status === 'rps1' || currentRoom.status === 'waiting';
        const winnerExists = rps1 && rps1.winner && rps1.winner !== 'draw';

        if (!validStatus || !winnerExists) {
            // 아직 가위바위보 안 끝났거나 다른 단계 → main이 적절히 라우팅
            goToMain();
            return;
        }

        // 이미 픽 순서가 결정된 경우 → 드래프트로
        if (currentRoom.pick_order && currentRoom.status === 'drafting') {
            goToDraft();
            return;
        }

        isWinner = (rps1.winner === ROLE);

        renderHeader(currentRoom);
        renderResultBanner();
        renderMembers();
        renderTeams();
        renderPickOrderControls();

        // 실시간 구독: status가 drafting으로 바뀌면 자동 이동
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                if (currentRoom.status === 'drafting') {
                    goToDraft();
                }
            }
        });

        hide('loadingView');
        show('orderView');
    })();

    function renderResultBanner() {
        const banner = $('resultBanner');
        if (isWinner) {
            banner.classList.add('win');
            $('resultIcon').innerText = '🏆';
            $('resultTitle').innerText = '가위바위보 승리!';
            $('resultDesc').innerText = '드래프트 멤버를 확인하고 픽 순서를 선택해주세요.';
        } else {
            banner.classList.add('lose');
            $('resultIcon').innerText = '😅';
            $('resultTitle').innerText = '아쉽게 졌습니다';
            $('resultDesc').innerText = '상대가 픽 순서를 결정 중입니다. 멤버를 미리 확인해보세요.';
        }
    }

    function renderMembers() {
        const list = $('memberPreviewList');
        const countEl = $('memberCount');
        if (!list) return;
        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        if (countEl) countEl.innerText = members.length;
        if (members.length === 0) {
            list.innerHTML = '<div class="member-preview-row" style="color:var(--text-muted); font-style:italic;">멤버 정보가 없습니다.</div>';
            return;
        }
        list.innerHTML = members.map(m =>
            `<div class="member-preview-row">${escapeHtml(m)}</div>`
        ).join('');
    }

    function renderTeams() {
        const myTeamLabel = ROLE === 'leader1' ? '1팀' : '2팀';
        const otherTeamLabel = ROLE === 'leader1' ? '2팀' : '1팀';
        const myLeaderName = ROLE === 'leader1' ? currentRoom.leader1_name : currentRoom.leader2_name;
        const otherLeaderName = ROLE === 'leader1' ? currentRoom.leader2_name : currentRoom.leader1_name;

        $('myTeamHeader').innerText = `🏆 내 팀 (${myTeamLabel})`;
        $('otherTeamHeader').innerText = `🤝 상대 팀 (${otherTeamLabel})`;

        const buildBox = (leaderName) => {
            let html = `<div class="team-vbox-row leader">👑 ${escapeHtml(leaderName || '(미정)')}</div>`;
            for (let i = 0; i < 4; i++) {
                html += `<div class="team-vbox-row empty">(픽 대기)</div>`;
            }
            return html;
        };

        $('myTeamBox').innerHTML = buildBox(myLeaderName);
        $('otherTeamBox').innerHTML = buildBox(otherLeaderName);
    }

    function renderPickOrderControls() {
        if (isWinner) {
            show('pickOrderControls');
            hide('loserWaiting');
        } else {
            hide('pickOrderControls');
            show('loserWaiting');
        }
    }

    // 픽 순서 선택 (이긴 사람만)
    async function onChoosePickOrder(pickFirst) {
        if (!isWinner) return;
        if (isProcessing) return;
        isProcessing = true;

        document.querySelectorAll('.order-btn').forEach(b => b.disabled = true);

        try {
            const client = initSupabase();
            const { data, error } = await client.rpc('set_pick_order', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_pick_first: pickFirst
            });
            if (error) {
                showToast('오류: ' + error.message);
                document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }
            if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '실패');
                document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }

            showToast(pickFirst ? '먼저 픽으로 결정!' : '나중 픽으로 결정!');
            hide('orderView');
            show('alreadyView');
            setTimeout(() => goToDraft(), 1500);
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
            document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
            isProcessing = false;
        }
    }
    </script>
</body>
</html>
