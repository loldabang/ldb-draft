<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽 순서 선택 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        /* 페이지 전용 스타일 */
        .order-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .order-btn {
            padding: 32px 16px;
            border: 3px solid var(--border);
            border-radius: 14px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Pretendard', sans-serif;
        }
        .order-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .order-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .order-btn.first {
            border-color: var(--warning);
            background: linear-gradient(135deg, #fffaf3, #fff3e0);
        }
        .order-btn.first:hover:not(:disabled) {
            border-color: #ff6f00;
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
        }
        .order-btn.last {
            border-color: var(--info);
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
        }
        .order-btn.last:hover:not(:disabled) {
            border-color: #0277bd;
            background: linear-gradient(135deg, #e0f2fe, #b3e5fc);
        }
        .order-icon {
            font-size: 44px;
            margin-bottom: 10px;
            line-height: 1;
        }
        .order-label {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .order-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* 픽 순서 설명 박스 */
        .order-explanation {
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .order-explanation strong {
            color: var(--text-main);
        }
        .order-explanation .sequence {
            font-family: 'Pretendard', monospace;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <!-- 헤더 -->
        <div id="headerArea"></div>

        <!-- 로딩 -->
        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">방 정보 불러오는 중...</div>
        </div>

        <!-- 픽 순서 선택 -->
        <div id="orderView" class="card" style="display:none;">
            <div class="status-box success" style="margin-bottom:8px;">
                <div class="status-icon">🏆</div>
                <div class="status-title">가위바위보 승리!</div>
                <div class="status-desc">픽 순서를 결정해주세요.</div>
            </div>

            <h2 style="margin-top:20px;">⚡ 픽 순서 선택</h2>
            <p style="text-align:center;">먼저 픽할지, 나중에 픽할지 선택하세요.</p>

            <div class="order-grid">
                <button class="order-btn first" onclick="onChoosePickOrder(true)">
                    <div class="order-icon">⚡</div>
                    <div class="order-label">먼저 픽</div>
                    <div class="order-desc">내가 1번째 픽으로<br>시작</div>
                </button>
                <button class="order-btn last" onclick="onChoosePickOrder(false)">
                    <div class="order-icon">🛡️</div>
                    <div class="order-label">나중 픽</div>
                    <div class="order-desc">상대가 먼저 픽,<br>내가 두 명씩 픽</div>
                </button>
            </div>

            <div class="order-explanation">
                <strong>📋 1-2-2-2-1 드래프트 순서</strong>
                <div class="sequence">A → B B → A A → B B → A</div>
                <div style="margin-top:8px;">
                    총 8픽으로 진행되며, "먼저 픽(A)"이 1번째와 마지막을 가져가고,
                    중간에는 2명씩 번갈아 픽합니다.
                </div>
            </div>
        </div>

        <!-- 이미 결정된 경우 (드물게 발생 가능) -->
        <div id="alreadyView" class="card" style="display:none;">
            <div class="status-box waiting">
                <div class="status-icon">⏳</div>
                <div class="status-title">잠시만 기다려주세요</div>
                <div class="status-desc">픽 순서가 처리되는 중입니다...</div>
            </div>
        </div>
    </div>

    <!-- Supabase + 공통 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // pick-order.html 로직
    // 1차 가위바위보 승자만 들어와야 하는 페이지
    // ========================================================================

    let currentRoom = null;
    let isProcessing = false;

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 검증: 1차 가위바위보 결과를 확인
        const rpsGames = await loadRpsGames();
        const rps1 = rpsGames.find(g => g.round === 1);

        // 정상 진입 조건: status가 rps1 또는 waiting이고, rps1 승자가 본인이어야 함
        const validStatus = currentRoom.status === 'rps1' || currentRoom.status === 'waiting';
        const isWinner = rps1 && rps1.winner && rps1.winner === ROLE;

        if (!validStatus || !isWinner) {
            // 잘못된 진입 → main.html이 적절한 페이지로 라우팅
            goToMain();
            return;
        }

        // 화면 셋업
        renderHeader(currentRoom,
            '🏆 STEP 2: 픽 순서 선택',
            '먼저 픽할지, 나중에 픽할지 선택하세요.'
        );

        // 실시간 구독 (상대가 뭔가 바꾸거나 방 상태 바뀌면 자동 라우팅)
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                // status가 drafting으로 바뀌면 → 드래프트 페이지로
                if (currentRoom.status === 'drafting') {
                    goToDraft();
                }
            }
        });

        hide('loadingView');
        show('orderView');
    })();

    // ========================================================================
    // 픽 순서 선택
    // ========================================================================
    async function onChoosePickOrder(pickFirst) {
        if (isProcessing) return;
        isProcessing = true;

        // 버튼 비활성화
        document.querySelectorAll('.order-btn').forEach(b => b.disabled = true);

        try {
            const client = initSupabase();
            const { data, error } = await client.rpc('set_pick_order', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_pick_first: pickFirst
            });
            if (error) {
                showToast('오류: ' + error.message);
                document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }
            if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '실패');
                document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
                isProcessing = false;
                return;
            }

            // 성공 - 화면 전환 (실시간 구독에서 자동 라우팅됨)
            showToast(pickFirst ? '먼저 픽으로 결정!' : '나중 픽으로 결정!');
            hide('orderView');
            show('alreadyView');
            // 안전망: 2초 후에도 라우팅 안 됐으면 직접 이동
            setTimeout(() => goToDraft(), 2000);
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
            document.querySelectorAll('.order-btn').forEach(b => b.disabled = false);
            isProcessing = false;
        }
    }
    </script>
</body>
</html>
