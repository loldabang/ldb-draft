<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        /* 페이지 전용 스타일 */
        .rps-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 8px;
        }
        .rps-btn {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 32px 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .rps-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .rps-btn.selected {
            background: linear-gradient(135deg, #fff8f3, #ffeed5);
            border-color: var(--warning);
            box-shadow: 0 0 0 4px rgba(245, 124, 0, 0.15);
        }
        /* 단계 G: 후보 선택 (확정 전) */
        .rps-btn.pending {
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            border-color: var(--warning);
            border-width: 3px;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.3);
        }
        .rps-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .rps-btn.selected:disabled,
        .rps-btn.pending:disabled {
            opacity: 1;
        }

        /* 단계 G: 확정 영역 */
        .confirm-rps-area {
            margin-top: 18px;
            padding: 14px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px dashed var(--warning);
            border-radius: 12px;
            text-align: center;
        }
        .confirm-rps-area .confirm-rps-label {
            font-size: 13px;
            color: #78350f;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .confirm-rps-area .confirm-rps-label .choice-name {
            color: #92400e;
            font-size: 15px;
            font-weight: 800;
        }
        #confirmRpsBtn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: var(--warning);
            color: #fff;
        }
        #confirmRpsBtn:hover:not(:disabled) { background: #ea580c; }
        #confirmRpsBtn:disabled {
            background: #d1d5db;
            color: #6b7280;
        }
        .rps-emoji {
            font-size: 56px;
            line-height: 1;
        }
        .rps-label {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* 결과 공개 애니메이션 */
        .result-display {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: center;
            margin-top: 16px;
            padding: 20px;
            background: linear-gradient(135deg, #f9fafb, #f3f4f6);
            border-radius: 12px;
        }
        .result-side {
            text-align: center;
        }
        .result-side .name {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .result-side .choice {
            font-size: 56px;
            line-height: 1;
        }
        .result-side .choice-label {
            font-size: 13px;
            margin-top: 6px;
            color: var(--text-muted);
        }
        .result-side.winner {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-radius: 10px;
            padding: 12px;
        }
        .result-side.winner .name {
            color: var(--success);
        }
        .result-side.loser {
            opacity: 0.6;
        }
        .vs-badge {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .round-banner {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            background: #fef3c7;
            color: #92400e;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <!-- 헤더 (공통) -->
        <div id="headerArea"></div>

        <!-- 로딩 -->
        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">방 정보 불러오는 중...</div>
        </div>

        <!-- 가위바위보 본문 -->
        <div id="rpsView" class="card" style="display:none;">
            <div style="text-align:center;">
                <span class="round-banner" id="roundBanner"></span>
            </div>
            <h2 id="rpsTitle">🎯 가위바위보</h2>
            <p id="rpsDesc" style="text-align:center; margin-bottom:16px;"></p>

            <div class="rps-container">
                <button class="rps-btn" data-choice="rock" onclick="onRpsButtonClick('rock')">
                    <div class="rps-emoji">✊</div>
                    <div class="rps-label">바위</div>
                </button>
                <button class="rps-btn" data-choice="scissors" onclick="onRpsButtonClick('scissors')">
                    <div class="rps-emoji">✌️</div>
                    <div class="rps-label">가위</div>
                </button>
                <button class="rps-btn" data-choice="paper" onclick="onRpsButtonClick('paper')">
                    <div class="rps-emoji">✋</div>
                    <div class="rps-label">보</div>
                </button>
            </div>

            <!-- 단계 G 추가: 확정 영역 (변경 가능, 확정 버튼) -->
            <div id="confirmRpsArea" class="confirm-rps-area" style="display:none;">
                <div class="confirm-rps-label" id="confirmRpsLabel">선택한 것: </div>
                <button class="btn" id="confirmRpsBtn" disabled onclick="onConfirmRps()">✅ 확정</button>
                <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">
                    확정 전에는 자유롭게 다른 걸로 바꿀 수 있습니다.
                </div>
            </div>

            <!-- 내 선택 후 대기 -->
            <div id="waitingBox" class="status-box waiting" style="display:none; margin-top:16px;">
                <div class="status-icon">⏳</div>
                <div class="status-title">상대방을 기다리는 중...</div>
                <div class="status-desc" id="waitingDesc"></div>
            </div>

            <!-- 결과 공개 -->
            <div id="resultBox" style="display:none;">
                <div class="result-display" id="resultDisplay"></div>
                <div id="afterResultBox" class="status-box" style="margin-top:16px;"></div>
            </div>
        </div>
    </div>

    <!-- Supabase + 공통 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // rps.html 로직
    // ========================================================================

    // round를 URL에서 가져옴 (1 또는 2)
    const ROUND = parseInt(urlParams.get('round') || '1', 10);

    // 상태 저장
    let currentRoom = null;
    let currentRps = null;
    let isProcessing = false;  // 클릭 후 응답 대기 중 중복 클릭 방지
    let lastWinnerSeen = null; // 결과 공개 애니메이션 후 라우팅 트리거용

    // 단계 O-3 (fix #2): 비김 큰 오버레이 — N팀과 동일한 디자인
    let _lastDrawEffectKey = null;
    function _showDrawEffect(key) {
        if (_lastDrawEffectKey === key) return;
        _lastDrawEffectKey = key;
        // 4초 후 lock 해제 (두 번째 비김도 표시되도록)
        setTimeout(() => {
            if (_lastDrawEffectKey === key) _lastDrawEffectKey = null;
        }, 4000);
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:99998; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); animation:drawFadeIn 0.3s ease-out;';
        overlay.innerHTML = `
            <div style="background:linear-gradient(135deg, #fef3c7, #fbbf24); border-radius:18px; padding:30px 40px; text-align:center; box-shadow:0 20px 60px rgba(245,158,11,0.5); animation:drawPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); border:3px solid #f59e0b;">
                <div style="font-size:64px; margin-bottom:6px; animation:drawShake 0.6s ease-out;">🤝</div>
                <div style="font-size:22px; font-weight:900; color:#92400e; margin-bottom:4px;">비김!</div>
                <div style="font-size:13px; color:#78350f; font-weight:700;">다시 가위바위보를 진행합니다</div>
            </div>
        `;
        if (!document.getElementById('drawEffectStyles')) {
            const st = document.createElement('style');
            st.id = 'drawEffectStyles';
            st.innerText = `
                @keyframes drawFadeIn { from { opacity:0; } to { opacity:1; } }
                @keyframes drawPop { 0% { transform:scale(0.3); opacity:0; } 50% { transform:scale(1.1); } 100% { transform:scale(1); opacity:1; } }
                @keyframes drawShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-15deg)} 75%{transform:rotate(15deg)} }
                @keyframes drawFadeOut { to { opacity:0; transform:scale(0.9); } }
            `;
            document.head.appendChild(st);
        }
        document.body.appendChild(overlay);
        setTimeout(() => {
            overlay.style.animation = 'drawFadeOut 0.4s ease-in forwards';
            setTimeout(() => { try { overlay.remove(); } catch(e){} }, 400);
        }, 1800);
    }

    // ========================================================================
    // 1. 초기화
    // ========================================================================
    (async function init() {
        // URL 파라미터 검증
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        // Supabase 초기화
        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        // round 검증
        if (ROUND !== 1 && ROUND !== 2) {
            showFatalError('잘못된 라운드입니다.');
            return;
        }

        // 방 정보 로드 + 토큰 검증
        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 단계 O: N팀 모드면 teams 캐시 미리 로드
        if (currentRoom.team_count && currentRoom.team_count > 0) {
            try {
                const _c = initSupabase();
                const { data: _teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                if (_teams) setTeamsCache(_teams);
            } catch (e) { console.warn('teams load failed:', e); }
        }

        // 단계 L: 팀장 잠금 — "본인이 맞으십니까?" 확인 + claim
        const claimed = await ensureLeaderClaim(currentRoom);
        if (!claimed) return;  // 거부 시 ensureLeaderClaim이 화면 교체함

        // 단계 O: N팀 모드면 가위바위보 1차가 없음 → main으로 (현재 status 라우팅)
        if (isNTeamMode(currentRoom)) {
            goToMain();
            return;
        }

        // 현재 단계 검증 (잘못된 시점에 접근한 경우 main.html로)
        if (!isCurrentRoundValid()) {
            goToMain();
            return;
        }

        // 가위바위보 정보 로드
        await loadRps();

        // 화면 셋업
        setupView();

        // 실시간 구독
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                // 단계가 바뀌면 라우팅
                if (!isCurrentRoundValid()) {
                    goToMain();
                }
            },
            onRps: async (payload) => {
                // 단계 H 수정: payload.new를 직접 사용 (race condition 없이 'draw' 캐치)
                // SQL이 비김 즉시 reset해도 realtime은 winner='draw' UPDATE와 reset UPDATE를
                // 별도 이벤트로 전달함. payload.new는 그 순간의 정확한 상태를 담고 있음.
                let newRps = (payload && payload.new) ? payload.new : null;
                if (!newRps) {
                    await loadRps();
                    newRps = currentRps;
                } else {
                    // currentRps 갱신
                    if (newRps.round === ROUND) currentRps = newRps;
                }

                // payload가 ROUND와 일치하지 않으면 무시 (다른 라운드 이벤트)
                if (newRps.round !== ROUND) {
                    renderRps();
                    return;
                }

                // 비김 감지 — payload.new에서 직접 확인
                // 단계 O-3 (fix #1): SQL이 'draw' winner 즉시 reset해서 양 팀 모두에게 안 보일 수 있음
                //   → 양 선택값으로 직접 클라이언트 판정 추가
                let isDraw = (newRps.winner === 'draw');
                if (!isDraw && newRps.leader1_choice && newRps.leader2_choice
                    && newRps.leader1_choice === newRps.leader2_choice
                    && !newRps.winner) {
                    // SQL이 reset해서 winner는 NULL이지만 choices 둘 다 있고 같음 → 비김
                    isDraw = true;
                }
                if (isDraw) {
                    const drawKey = 'draw_' + ROUND + '_' + (newRps.leader1_choice || '') + '_' + (newRps.leader2_choice || '');
                    if (lastWinnerSeen !== drawKey) {
                        lastWinnerSeen = drawKey;
                        // 단계 O-3 (fix #2): 큰 오버레이 (N팀과 동일)
                        _showDrawEffect(drawKey);
                    }
                    disableButtons();
                    show('waitingBox');
                    const wd = $('waitingDesc');
                    if (wd) {
                        const emoji = ch => ({ rock: '✊', paper: '✋', scissors: '✌️' })[ch] || '?';
                        const ch = newRps.leader1_choice || newRps.leader2_choice;
                        wd.innerHTML = `🤝 <strong>비겼습니다!</strong><br>둘 다 ${emoji(ch)}<br>잠시 후 자동으로 다시 시작됩니다...`;
                    }
                    // pending 정리
                    pendingChoice = null;
                    const area = $('confirmRpsArea');
                    if (area) area.style.display = 'none';
                    document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('pending'));
                    // 1.5초 후 자연스럽게 reset UI로 (다음 reset 이벤트가 보통 더 빨리 옴)
                    setTimeout(() => {
                        loadRps().then(() => renderRps()).catch(() => {});
                    }, 1500);
                    return;
                }

                // 정상 흐름
                renderRps();
            }
        });

        // 첫 렌더
        renderRps();

        hide('loadingView');
        show('rpsView');
    })();

    // ========================================================================
    // 2. 유틸: 현재 라운드가 유효한 상태인지
    // ========================================================================
    function isCurrentRoundValid() {
        const s = currentRoom.status;
        if (ROUND === 1) return s === 'waiting' || s === 'rps1';
        if (ROUND === 2) return s === 'rps2';
        return false;
    }

    async function loadRps() {
        const games = await loadRpsGames();
        currentRps = games.find(g => g.round === ROUND) || null;
    }

    // ========================================================================
    // 3. 화면 셋업 (라운드별 텍스트)
    // ========================================================================
    function setupView() {
        const stageTitle = ROUND === 1
            ? '🎯 STEP 1: 가위바위보 (픽 순서)'
            : '🎯 STEP 3: 가위바위보 (진영)';
        const stageSubtitle = ROUND === 1
            ? '이긴 사람이 픽 순서를 정합니다.'
            : '이긴 사람이 블루/레드 진영을 정합니다.';
        renderHeader(currentRoom, stageTitle, stageSubtitle);

        $('roundBanner').innerText = ROUND === 1 ? '1차 — 픽 순서' : '2차 — 진영';
        $('rpsTitle').innerText = ROUND === 1
            ? '🎯 가위바위보 — 픽 순서 결정'
            : '🎯 가위바위보 — 진영 결정';
        $('rpsDesc').innerText = ROUND === 1
            ? '이긴 사람이 먼저 픽할지 나중에 픽할지 결정합니다.'
            : '이긴 사람이 블루/레드 진영을 결정합니다.';
    }

    // ========================================================================
    // 4. 가위바위보 선택 (단계 G: 후보 선택 → 확정 흐름)
    // ========================================================================

    // 단계 G 추가: 후보 선택 상태 (확정 전, 자유 변경 가능)
    let pendingChoice = null;

    // 가위/바위/보 버튼 클릭 → 후보 선택만 (확정 X)
    function onRpsButtonClick(choice) {
        if (isProcessing) return;
        if (!currentRps) {
            showToast('아직 게임 준비 중입니다. 잠시 후 다시 시도해주세요.');
            return;
        }
        const myField = ROLE === 'leader1' ? currentRps.leader1_choice : currentRps.leader2_choice;
        if (myField) {
            showToast('이미 확정한 선택은 변경할 수 없습니다.');
            return;
        }

        if (pendingChoice === choice) {
            pendingChoice = null;
        } else {
            pendingChoice = choice;
        }
        renderPendingChoice();
    }

    // 후보 선택 UI 갱신 (.pending 클래스 + 확정 버튼 활성화)
    function renderPendingChoice() {
        document.querySelectorAll('.rps-btn').forEach(btn => {
            if (btn.dataset.choice === pendingChoice) {
                btn.classList.add('pending');
            } else {
                btn.classList.remove('pending');
            }
        });
        const area = $('confirmRpsArea');
        const label = $('confirmRpsLabel');
        const btn = $('confirmRpsBtn');
        if (!area || !label || !btn) return;

        if (pendingChoice) {
            area.style.display = 'block';
            label.innerHTML = `선택한 것: <span class="choice-name">${rpsEmoji(pendingChoice)} ${rpsKorean(pendingChoice)}</span>`;
            btn.disabled = isProcessing;
        } else {
            area.style.display = 'none';
            btn.disabled = true;
        }
    }

    // [확정] 버튼 — 실제 RPC 호출
    async function onConfirmRps() {
        if (isProcessing) return;
        if (!pendingChoice) return;
        if (!currentRps) return;
        const myField = ROLE === 'leader1' ? currentRps.leader1_choice : currentRps.leader2_choice;
        if (myField) {
            showToast('이미 확정했습니다.');
            return;
        }

        const choice = pendingChoice;
        isProcessing = true;
        const btn = $('confirmRpsBtn');
        if (btn) { btn.disabled = true; btn.innerText = '⏳ 확정 중...'; }

        try {
            const client = initSupabase();
            const { data, error } = await client.rpc('make_rps_choice', {
                p_room_code: ROOM_CODE,
                p_leader_token: TOKEN,
                p_round: ROUND,
                p_choice: choice
            });
            if (error) {
                showToast('오류: ' + error.message);
                if (btn) btn.innerText = '✅ 확정';
                return;
            }
            if (data && data[0] && !data[0].success) {
                showToast(data[0].message || '선택 실패');
                if (btn) btn.innerText = '✅ 확정';
                return;
            }
            // 단계 G: RPC 응답으로 비김 즉시 감지 (SQL이 즉시 reset해서 realtime 너무 빠름)
            const respWinner = data && data[0] && data[0].winner;
            if (respWinner === 'draw') {
                // 단계 O-3 (fix #2): 큰 오버레이 (N팀과 동일)
                const drawKey = 'rpcDraw_' + ROUND + '_' + Date.now();
                _showDrawEffect(drawKey);
                // 화면도 즉시 안내 (잠시)
                const wb = $('waitingBox');
                if (wb) {
                    show('waitingBox');
                    const wd = $('waitingDesc');
                    if (wd) wd.innerHTML = '🤝 <strong>비겼습니다!</strong> 잠시 후 자동으로 다시 시작됩니다...';
                }
                // 1.8초 후 UI를 자연스럽게 리셋
                setTimeout(() => {
                    pendingChoice = null;
                    clearSelected();
                    document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('pending'));
                    const area = $('confirmRpsArea');
                    if (area) area.style.display = 'none';
                    hide('waitingBox');
                    enableButtons();
                }, 1800);
            }
            // 성공: pendingChoice 정리 후 renderRps로 후속 UI
            pendingChoice = null;
            await loadRps();
            renderRps();
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
        } finally {
            isProcessing = false;
            if (btn && btn.innerText.startsWith('⏳')) btn.innerText = '✅ 확정';
        }
    }

    // ========================================================================
    // 5. 렌더링
    // ========================================================================
    function renderRps() {
        if (!currentRps) {
            // 가위바위보 정보 없음 — 그냥 버튼만 보임
            enableButtons();
            hide('waitingBox');
            hide('resultBox');
            clearSelected();
            return;
        }

        const myChoice = ROLE === 'leader1' ? currentRps.leader1_choice : currentRps.leader2_choice;
        const otherChoice = ROLE === 'leader1' ? currentRps.leader2_choice : currentRps.leader1_choice;
        const winner = currentRps.winner;

        // 결과 났고 비긴 게 아니면 → 결과 공개 → 잠시 후 라우팅
        if (winner && winner !== 'draw') {
            // 새로 본 결과인 경우만 결과 공개 애니메이션
            const isNewWinnerSeen = lastWinnerSeen !== winner;
            lastWinnerSeen = winner;

            disableButtons();
            hide('waitingBox');
            show('resultBox');
            renderResultDisplay(myChoice, otherChoice, winner);

            // 결과 공개 후 → 라우팅 (이긴 사람: pick-order/side, 진 사람: 자동 대기)
            const afterBox = $('afterResultBox');
            if (winner === ROLE) {
                afterBox.className = 'status-box success';
                afterBox.innerHTML = `
                    <div class="status-icon">🏆</div>
                    <div class="status-title">승리!</div>
                    <div class="status-desc">${ROUND === 1 ? '픽 순서' : '진영'}를 선택하러 이동합니다...</div>
                `;
                if (isNewWinnerSeen) {
                    setTimeout(() => {
                        if (ROUND === 1) goToPickOrder();
                        else goToSide();
                    }, 1800);
                }
            } else {
                afterBox.className = 'status-box waiting';
                afterBox.innerHTML = `
                    <div class="status-icon">😔</div>
                    <div class="status-title">패배</div>
                    <div class="status-desc">${ROUND === 1 ? '드래프트 멤버 미리보기로 이동합니다...' : '결과 화면으로 이동합니다...'}</div>
                `;
                // 단계 F 변경: ROUND 1에서는 진 사람도 pick-order로 자동 이동 (read-only)
                if (isNewWinnerSeen) {
                    setTimeout(() => {
                        if (ROUND === 1) goToPickOrder();
                        // ROUND 2의 진 사람은 onRoom의 status 변화로 라우팅됨
                    }, 1800);
                }
            }
            return;
        }

        // 결과 X (선택 진행 중)
        hide('resultBox');

        // 내 선택 표시
        clearSelected();
        if (myChoice) {
            const btn = document.querySelector(`.rps-btn[data-choice="${myChoice}"]`);
            if (btn) btn.classList.add('selected');
            // 단계 G: 확정한 사람은 confirm 영역 숨김 + pending 해제
            pendingChoice = null;
            const area = $('confirmRpsArea');
            if (area) area.style.display = 'none';
            document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('pending'));
        }

        // 상태에 따른 분기
        if (myChoice && !otherChoice) {
            // 내가 골랐고 상대 아직
            disableButtons();
            show('waitingBox');
            $('waitingDesc').innerHTML = `내 선택: <strong>${rpsEmoji(myChoice)} ${rpsKorean(myChoice)}</strong>`;
        } else if (!myChoice && otherChoice) {
            // 상대가 골랐고 나 아직 (상대 선택은 안 보여줌)
            enableButtons();
            hide('waitingBox');
            // pending 상태 복원
            renderPendingChoice();
        } else if (myChoice && otherChoice && winner === 'draw') {
            // 단계 G: 비김 시 명확히 알림 + 토스트 한 번
            disableButtons();
            show('waitingBox');
            $('waitingDesc').innerHTML = '🤝 <strong>비겼습니다!</strong> 잠시 후 자동으로 다시 시작됩니다...';
            const drawKey = 'draw_' + ROUND + '_' + myChoice + '_' + otherChoice;
            if (lastWinnerSeen !== drawKey) {
                lastWinnerSeen = drawKey;
                showToast('🤝 비겼습니다! 다시 시작합니다.', 2500);
            }
            // pending 정리
            pendingChoice = null;
            const area = $('confirmRpsArea');
            if (area) area.style.display = 'none';
            document.querySelectorAll('.rps-btn').forEach(b => b.classList.remove('pending'));
        } else {
            // 둘 다 안 골랐음
            enableButtons();
            hide('waitingBox');
            // 단계 G: pending 상태 복원 (페이지 재렌더 시)
            renderPendingChoice();
        }
    }

    function renderResultDisplay(myChoice, otherChoice, winner) {
        const myName = getMyDisplayName(currentRoom);
        const otherName = getOtherDisplayName(currentRoom);
        const myWon = winner === ROLE;

        $('resultDisplay').innerHTML = `
            <div class="result-side ${myWon ? 'winner' : 'loser'}">
                <div class="name">${myName} (나)</div>
                <div class="choice">${rpsEmoji(myChoice)}</div>
                <div class="choice-label">${rpsKorean(myChoice)}</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="result-side ${myWon ? 'loser' : 'winner'}">
                <div class="name">${otherName}</div>
                <div class="choice">${rpsEmoji(otherChoice)}</div>
                <div class="choice-label">${rpsKorean(otherChoice)}</div>
            </div>
        `;
    }

    function clearSelected() {
        document.querySelectorAll('.rps-btn').forEach(btn => btn.classList.remove('selected'));
    }
    function disableButtons() {
        document.querySelectorAll('.rps-btn').forEach(btn => btn.disabled = true);
    }
    function enableButtons() {
        document.querySelectorAll('.rps-btn').forEach(btn => btn.disabled = false);
    }
    </script>
</body>
</html>
