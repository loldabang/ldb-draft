<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드래프트 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        /* 페이지 전용 스타일 */
        .draft-status {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            padding: 18px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            transition: background 0.3s;
        }
        .draft-status.my-turn {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .draft-status.done {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
        }
        .draft-status .current-text {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* 진행 슬롯 (1~8) */
        .draft-progress {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pick-slot {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #6b7280;
            position: relative;
        }
        .pick-slot.done.leader1 {
            background: var(--team1-color);
            color: #fff;
        }
        .pick-slot.done.leader2 {
            background: var(--team2-color);
            color: #fff;
        }
        .pick-slot.current {
            background: var(--warning);
            color: #fff;
            animation: pulse 1s ease-in-out infinite;
        }
        .pick-slot-label {
            font-size: 9px;
            margin-top: 2px;
            color: var(--text-muted);
            text-align: center;
            min-height: 12px;
        }
        .pick-slot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        /* 멤버 그리드 */
        .members-section {
            margin-top: 20px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .members-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 600px) {
            .members-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .member-btn {
            padding: 14px 10px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Pretendard', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
        }
        .member-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .member-btn:disabled {
            cursor: not-allowed;
        }
        .member-btn.picked-leader1 {
            background: var(--team1-bg);
            border-color: var(--team1-color);
            color: var(--team1-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn.picked-leader2 {
            background: var(--team2-bg);
            border-color: var(--team2-color);
            color: var(--team2-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn .pick-tag {
            display: block;
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px;
            opacity: 0.8;
        }
        .member-btn.is-leader {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            border-style: dashed;
            cursor: not-allowed;
            color: var(--text-muted);
        }
        .member-btn.is-leader.is-mine {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-color: var(--warning);
            border-style: solid;
            color: #92400e;
        }
        .member-btn.is-leader .leader-tag {
            display: block;
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* 단계 D 추가: 후보로 선택된 멤버 (확정 전 상태) */
        .member-btn.is-selected {
            border-color: var(--warning);
            border-width: 3px;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            color: #9a3412;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.28);
        }
        .member-btn.is-selected::after {
            content: '✓ 선택됨';
            display: block;
            font-size: 10px;
            font-weight: 700;
            margin-top: 4px;
            color: var(--warning);
            letter-spacing: 0.5px;
        }

        /* 단계 D 추가: 확정 버튼 영역 */
        .confirm-pick-area {
            margin-top: 18px;
            padding: 14px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px dashed var(--warning);
            border-radius: 12px;
            text-align: center;
        }
        .confirm-pick-area .confirm-pick-label {
            font-size: 13px;
            color: #78350f;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .confirm-pick-area .confirm-pick-label .pick-name {
            color: #92400e;
            font-size: 15px;
            font-weight: 800;
        }
        #confirmPickBtn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: var(--warning);
            color: #fff;
        }
        #confirmPickBtn:hover:not(:disabled) {
            background: #ea580c;
        }
        #confirmPickBtn:disabled {
            background: #d1d5db;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="page-wrap" style="max-width: 1000px;">
        <!-- 헤더 -->
        <div id="headerArea"></div>

        <!-- 로딩 -->
        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">드래프트 정보 불러오는 중...</div>
        </div>

        <!-- 드래프트 본문 -->
        <div id="draftView" style="display:none;">
            <!-- 상태 + 진행 -->
            <div class="card">
                <div id="draftStatusBox" class="draft-status">
                    <div class="current-text" id="currentText">로딩 중...</div>
                    <div class="draft-progress" id="draftProgress"></div>
                </div>

                <!-- 단계 D/E: 확정 버튼 영역 (본인 차례일 때만) -->
                <div id="confirmPickArea" class="confirm-pick-area" style="display:none;">
                    <div class="confirm-pick-label" id="confirmPickLabel">멤버를 선택해주세요</div>
                    <button class="btn" id="confirmPickBtn" disabled onclick="onConfirmPick()">✅ 픽 확정</button>
                </div>
            </div>

            <!-- 2단 그리드: 왼쪽 멤버 / 오른쪽 양 팀 -->
            <div class="split-grid">
                <!-- 왼쪽: 픽 가능한 멤버 -->
                <div class="card">
                    <div class="section-title">📋 픽 가능한 멤버</div>
                    <div id="membersGrid" class="members-grid"></div>
                </div>

                <!-- 오른쪽: 내 팀 (위) / 상대 팀 (아래) -->
                <div class="split-grid-right">
                    <div class="card">
                        <div class="section-title" id="myTeamHeader">🏆 내 팀</div>
                        <div id="myTeamBox"></div>
                    </div>
                    <div class="card">
                        <div class="section-title" id="otherTeamHeader">🤝 상대 팀</div>
                        <div id="otherTeamBox"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase + 공통 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // draft.html 로직
    // 1-2-2-2-1 순서로 8픽 진행
    // ========================================================================

    // 픽 순서: A=먼저픽, B=나중픽
    // 픽 번호:  1=A, 2=B, 3=B, 4=A, 5=A, 6=B, 7=B, 8=A
    const PICK_ORDER = ['A', 'B', 'B', 'A', 'A', 'B', 'B', 'A'];
    const TOTAL_PICKS = 8;

    let currentRoom = null;
    let currentDrafts = [];
    let isProcessing = false;

    // 단계 E 변경: 후보 멤버 목록 (배열, 1명 또는 2명. 본인 연속 픽 수에 따라)
    let pendingPicks = [];

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 상태 검증
        if (currentRoom.status !== 'drafting') {
            // 다른 단계라면 main.html로
            goToMain();
            return;
        }

        // 픽 순서가 정해져 있는지
        if (!currentRoom.pick_order) {
            goToMain();
            return;
        }

        // 드래프트 픽 로드
        currentDrafts = await loadDrafts();

        // 헤더
        renderHeader(currentRoom,
            '⚔️ STEP 2: 드래프트 진행',
            '1-2-2-2-1 순서로 멤버를 픽합니다.'
        );

        // 실시간 구독
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                // 다음 단계로 넘어갔으면 라우팅
                if (currentRoom.status === 'rps2') {
                    goToRps(2);
                } else if (currentRoom.status === 'done') {
                    goToDone();
                }
            },
            onDraft: async () => {
                currentDrafts = await loadDrafts();
                renderDraft();
            }
        });

        hide('loadingView');
        show('draftView');
        renderDraft();
    })();

    // ========================================================================
    // 단계 E 변경: 다중 후보 선택 (1-2명 차례에 맞게)
    // ========================================================================
    function onMemberSelect(memberName) {
        if (!_isMyTurnNow()) return;
        const pickedMap = _buildPickedMap();
        if (pickedMap[memberName]) return;

        const allowed = _getMyAllowedPicks();
        const idx = pendingPicks.indexOf(memberName);

        if (idx !== -1) {
            // 이미 선택된 멤버 → 해제
            pendingPicks.splice(idx, 1);
        } else if (pendingPicks.length < allowed) {
            // 새로 추가
            pendingPicks.push(memberName);
        } else {
            showToast(`이번 차례는 ${allowed}명까지만 선택 가능합니다.\n다른 선택을 해제하고 골라주세요.`);
            return;
        }
        renderDraft();
    }

    // ========================================================================
    // 단계 E: [확정] 버튼 — 선택한 멤버들을 순서대로 RPC 호출
    // ========================================================================
    async function onConfirmPick() {
        if (isProcessing) return;
        if (pendingPicks.length === 0) return;
        if (!_isMyTurnNow()) return;

        // 이중 확인: 후보들이 그 사이에 이미 픽됐는지
        const pickedMap = _buildPickedMap();
        const stillAvailable = pendingPicks.filter(m => !pickedMap[m]);
        if (stillAvailable.length < pendingPicks.length) {
            showToast('일부 멤버가 이미 픽되었습니다. 다시 선택해주세요.');
            pendingPicks = stillAvailable;
            renderDraft();
            return;
        }

        isProcessing = true;
        const btn = $('confirmPickBtn');
        if (btn) { btn.disabled = true; btn.innerText = '⏳ 확정 중...'; }

        const toSubmit = [...pendingPicks];
        let successCount = 0;

        try {
            const client = initSupabase();
            for (let i = 0; i < toSubmit.length; i++) {
                const m = toSubmit[i];
                const { data, error } = await client.rpc('make_draft_pick', {
                    p_room_code: ROOM_CODE,
                    p_leader_token: TOKEN,
                    p_member_name: m
                });
                if (error) {
                    showToast('오류: ' + error.message);
                    break;
                }
                if (data && data[0] && !data[0].success) {
                    showToast(data[0].message || '픽 실패');
                    break;
                }
                successCount++;
            }
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
        }

        if (successCount > 0) {
            const submittedNames = toSubmit.slice(0, successCount).join(', ');
            showToast(submittedNames + ' 픽 완료!');
        }
        pendingPicks = [];
        currentDrafts = await loadDrafts();
        isProcessing = false;
        const btn2 = $('confirmPickBtn');
        if (btn2) btn2.innerText = '✅ 픽 확정';
        renderDraft();
    }

    // ── 단계 E 헬퍼들 ───────────────────────────────────────────────────────
    function _buildPickedMap() {
        const map = {};
        currentDrafts.forEach(d => { map[d.picked_member] = d.picker; });
        return map;
    }
    function _isMyTurnNow() {
        const pickCount = currentDrafts.length;
        if (pickCount >= TOTAL_PICKS) return false;
        const pickerA = currentRoom.pick_order;
        const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';
        const slot = PICK_ORDER[pickCount];
        const expected = slot === 'A' ? pickerA : pickerB;
        return expected === ROLE;
    }
    // 본인 차례에서 연속으로 픽할 수 있는 수 (1-2-2-2-1 패턴 기반)
    function _getMyAllowedPicks() {
        const pickCount = currentDrafts.length;
        if (pickCount >= TOTAL_PICKS) return 0;
        const pickerA = currentRoom.pick_order;
        const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';
        let count = 0;
        for (let i = pickCount; i < TOTAL_PICKS; i++) {
            const slot = PICK_ORDER[i];
            const expected = slot === 'A' ? pickerA : pickerB;
            if (expected !== ROLE) break;
            count++;
        }
        return count;
    }

    // ========================================================================
    // 렌더링
    // ========================================================================
    function renderDraft() {
        const pickCount = currentDrafts.length;
        const nextPickNumber = pickCount + 1;

        // 픽 순서 (A=먼저픽 = currentRoom.pick_order)
        const pickerA = currentRoom.pick_order; // 'leader1' or 'leader2'
        const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';

        // 다음 픽 차례
        let expectedPicker = null;
        if (pickCount < TOTAL_PICKS) {
            const slot = PICK_ORDER[pickCount];
            expectedPicker = slot === 'A' ? pickerA : pickerB;
        }
        const isMyTurn = expectedPicker === ROLE;
        const isDone = pickCount >= TOTAL_PICKS;

        // 단계 E: pendingPicks 중 invalid한 항목 자동 제거
        if (pendingPicks.length > 0) {
            const pickedMap = _buildPickedMap();
            if (!isMyTurn) {
                pendingPicks = [];
            } else {
                pendingPicks = pendingPicks.filter(m => !pickedMap[m]);
            }
        }

        // 상태 박스
        const statusBox = $('draftStatusBox');
        const currentText = $('currentText');
        if (isDone) {
            statusBox.className = 'draft-status done';
            currentText.innerText = '✅ 드래프트 완료! 다음 단계로 이동 중...';
        } else if (isMyTurn) {
            statusBox.className = 'draft-status my-turn';
            currentText.innerText = `🔥 내 차례! (${nextPickNumber}픽 / 총 ${TOTAL_PICKS}픽)`;
        } else {
            statusBox.className = 'draft-status';
            const otherName = getRoleDisplay(expectedPicker, currentRoom);
            currentText.innerText = `⏳ ${otherName}의 차례 (${nextPickNumber}픽 / 총 ${TOTAL_PICKS}픽)`;
        }

        // 진행 슬롯
        renderProgress(pickCount, pickerA, pickerB);

        // 멤버 그리드
        renderMembers(isMyTurn);

        // 단계 D 추가: 확정 영역 갱신
        renderConfirmArea(isMyTurn);

        // 팀 구성
        renderTeams();
    }

    // 단계 E: 확정 영역 갱신 (다중 픽 지원)
    function renderConfirmArea(isMyTurn) {
        const area = $('confirmPickArea');
        const label = $('confirmPickLabel');
        const btn = $('confirmPickBtn');
        if (!area || !label || !btn) return;

        if (!isMyTurn) {
            area.style.display = 'none';
            return;
        }

        area.style.display = 'block';
        const allowed = _getMyAllowedPicks();

        if (pendingPicks.length === 0) {
            const hint = allowed > 1 ? `${allowed}명 동시 선택 가능` : '';
            label.innerText = `💡 멤버를 선택한 뒤 [픽 확정]을 눌러주세요${hint ? ' (' + hint + ')' : ''}`;
            btn.disabled = true;
        } else {
            const escapedNames = pendingPicks.map(escapeHtml).join(', ');
            label.innerHTML = `선택한 멤버 (${pendingPicks.length}/${allowed}): <span class="pick-name">${escapedNames}</span>`;
            btn.disabled = isProcessing;
        }
    }

    function renderProgress(pickCount, pickerA, pickerB) {
        const html = [];
        for (let i = 0; i < TOTAL_PICKS; i++) {
            const slot = PICK_ORDER[i];
            const owner = slot === 'A' ? pickerA : pickerB;
            const done = i < pickCount;
            const current = i === pickCount;

            let cls = 'pick-slot';
            if (done) {
                cls += ` done ${owner}`;
            } else if (current) {
                cls += ' current';
            }

            const labelText = slot === 'A' ? '1팀' : '2팀'; // 시각적 안내
            const actualTeam = owner === 'leader1' ? '1팀' : '2팀';

            html.push(`
                <div class="pick-slot-wrap">
                    <div class="${cls}">${i + 1}</div>
                    <div class="pick-slot-label">${actualTeam}</div>
                </div>
            `);
        }
        $('draftProgress').innerHTML = html.join('');
    }

    function renderMembers(isMyTurn) {
        const members = currentRoom.members || [];
        const pickedMap = {};
        currentDrafts.forEach(d => { pickedMap[d.picked_member] = d.picker; });

        const leader1Name = currentRoom.leader1_name;
        const leader2Name = currentRoom.leader2_name;
        const myName = getMyDisplayName(currentRoom);

        const grid = $('membersGrid');
        grid.innerHTML = '';

        members.forEach(m => {
            const btn = document.createElement('button');
            btn.className = 'member-btn';
            btn.type = 'button';

            const isLeader = m === leader1Name || m === leader2Name;
            const isMine = m === myName;
            const pickedBy = pickedMap[m];

            if (isLeader) {
                btn.classList.add('is-leader');
                if (isMine) btn.classList.add('is-mine');
                const teamLabel = m === leader1Name ? '1팀 팀장' : '2팀 팀장';
                btn.innerHTML = `👑 ${escapeHtml(m)}<span class="leader-tag">${teamLabel}</span>`;
                btn.disabled = true;
            } else if (pickedBy) {
                btn.classList.add(`picked-${pickedBy}`);
                const teamLabel = pickedBy === 'leader1' ? '1팀' : '2팀';
                btn.innerHTML = `${escapeHtml(m)}<span class="pick-tag">→ ${teamLabel}</span>`;
                btn.disabled = true;
            } else if (isMyTurn) {
                // 단계 E: 다중 선택 지원
                btn.innerText = m;
                btn.style.position = 'relative';
                const orderIdx = pendingPicks.indexOf(m);
                if (orderIdx !== -1) {
                    btn.classList.add('is-selected');
                    // 다중 선택일 때만 순서 뱃지 표시
                    if (_getMyAllowedPicks() > 1) {
                        const badge = document.createElement('span');
                        badge.style.cssText = 'position:absolute; top:4px; right:6px; background:var(--warning); color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; box-shadow:0 2px 6px rgba(0,0,0,0.15);';
                        badge.innerText = String(orderIdx + 1);
                        btn.appendChild(badge);
                    }
                }
                btn.onclick = () => onMemberSelect(m);
            } else {
                btn.innerText = m;
                btn.disabled = true;
            }
            grid.appendChild(btn);
        });
    }

    // 단계 E: 새 레이아웃 — 내 팀 (위) / 상대 팀 (아래)
    function renderTeams() {
        // ROLE 기준으로 내/상대 결정
        const myTeamLabel = ROLE === 'leader1' ? '1팀' : '2팀';
        const otherTeamLabel = ROLE === 'leader1' ? '2팀' : '1팀';
        const myLeaderName = ROLE === 'leader1' ? currentRoom.leader1_name : currentRoom.leader2_name;
        const otherLeaderName = ROLE === 'leader1' ? currentRoom.leader2_name : currentRoom.leader1_name;
        const myRole = ROLE; // 'leader1' or 'leader2'
        const otherRole = ROLE === 'leader1' ? 'leader2' : 'leader1';

        const myPicks = currentDrafts.filter(d => d.picker === myRole).map(d => d.picked_member);
        const otherPicks = currentDrafts.filter(d => d.picker === otherRole).map(d => d.picked_member);

        $('myTeamHeader').innerText = `🏆 내 팀 (${myTeamLabel}) — ${1 + myPicks.length}명`;
        $('otherTeamHeader').innerText = `🤝 상대 팀 (${otherTeamLabel}) — ${1 + otherPicks.length}명`;

        const buildBox = (leaderName, picks) => {
            let html = `<div class="team-vbox-row leader">👑 ${escapeHtml(leaderName || '(미정)')}</div>`;
            for (let i = 0; i < 4; i++) {
                if (i < picks.length) {
                    html += `<div class="team-vbox-row">${escapeHtml(picks[i])}</div>`;
                } else {
                    html += `<div class="team-vbox-row empty">(픽 대기)</div>`;
                }
            }
            return html;
        };

        $('myTeamBox').innerHTML = buildBox(myLeaderName, myPicks);
        $('otherTeamBox').innerHTML = buildBox(otherLeaderName, otherPicks);
    }
    </script>
</body>
</html>
