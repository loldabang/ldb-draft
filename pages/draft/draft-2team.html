<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드래프트 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        /* 페이지 전용 스타일 */
        .draft-status {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            padding: 18px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            transition: background 0.3s;
        }
        .draft-status.my-turn {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .draft-status.done {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
        }
        .draft-status .current-text {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* 진행 슬롯 (1~8) */
        .draft-progress {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pick-slot {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #6b7280;
            position: relative;
        }
        .pick-slot.done.leader1 {
            background: var(--team1-color);
            color: #fff;
        }
        .pick-slot.done.leader2 {
            background: var(--team2-color);
            color: #fff;
        }
        .pick-slot.current {
            background: var(--warning);
            color: #fff;
            animation: pulse 1s ease-in-out infinite;
        }
        /* 단계 O-3 (fix): 본인 팀 픽 슬롯 강조 (살짝 다른 색) */
        .pick-slot.is-mine:not(.done):not(.current) {
            background: #c7d2fe;  /* 연한 보라 */
            color: #4338ca;
            box-shadow: inset 0 0 0 2px #6366f1;
        }
        .pick-slot.is-mine.current {
            box-shadow: 0 0 0 3px #6366f1, 0 0 12px rgba(99, 102, 241, 0.5);
        }
        .pick-slot-wrap.is-mine-wrap .pick-slot-label {
            color: #4338ca;
            font-weight: 800;
        }
        .pick-slot-label {
            font-size: 9px;
            margin-top: 2px;
            color: var(--text-muted);
            text-align: center;
            min-height: 12px;
        }
        .pick-slot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        /* 멤버 그리드 — 단계 F: 1열로 (왼쪽에 세로로 쭈욱) */
        .members-section {
            margin-top: 0;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .members-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .member-btn {
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Pretendard', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
        }
        /* 단계 P-3: 라인고정 모드 — 멤버 이름 한 줄로 (필요 시 잘림) */
        body.line-fixed-mode-draft .member-btn .member-name-wrap {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            min-width: 0;
            flex: 1;
        }
        .member-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .member-btn:disabled {
            cursor: not-allowed;
        }
        .member-btn.picked-leader1 {
            background: var(--team1-bg);
            border-color: var(--team1-color);
            color: var(--team1-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn.picked-leader2 {
            background: var(--team2-bg);
            border-color: var(--team2-color);
            color: var(--team2-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn .pick-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(0,0,0,0.07);
            flex-shrink: 0;
        }
        .member-btn.is-leader {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            border-style: dashed;
            cursor: not-allowed;
            color: var(--text-muted);
        }
        .member-btn.is-leader.is-mine {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-color: var(--warning);
            border-style: solid;
            color: #92400e;
        }
        .member-btn.is-leader .leader-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(0,0,0,0.07);
            flex-shrink: 0;
        }

        /* 후보로 선택된 멤버 (확정 전) */
        .member-btn.is-selected {
            border-color: var(--warning);
            border-width: 3px;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            color: #9a3412;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.28);
        }
        .member-btn .selected-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            background: var(--warning);
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        /* 단계 D 추가: 확정 버튼 영역 */
        .confirm-pick-area {
            margin-top: 18px;
            padding: 14px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px dashed var(--warning);
            border-radius: 12px;
            text-align: center;
        }
        .confirm-pick-area .confirm-pick-label {
            font-size: 13px;
            color: #78350f;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .confirm-pick-area .confirm-pick-label .pick-name {
            color: #92400e;
            font-size: 15px;
            font-weight: 800;
        }
        #confirmPickBtn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: var(--warning);
            color: #fff;
        }
        #confirmPickBtn:hover:not(:disabled) {
            background: #ea580c;
        }
        #confirmPickBtn:disabled {
            background: #d1d5db;
            color: #6b7280;
        }
    </style>
</head>
<body class="draft-wide">
    <div class="page-wrap" style="max-width: 1100px;">
        <!-- 헤더 -->
        <div id="headerArea"></div>

        <!-- 로딩 -->
        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">드래프트 정보 불러오는 중...</div>
        </div>

        <!-- 드래프트 본문 -->
        <div id="draftView" style="display:none;">
            <!-- 단계 O-3 (fix #1): 3단 레이아웃 (왼쪽=헤더+내팀 / 중앙=상태+멤버 / 오른쪽=상대팀들) -->
            <div class="draft-3col-grid">
                <!-- ── 왼쪽 ───────────────────────────────── -->
                <div id="leftColumn">
                    <!-- 내 팀 (team-vbox-title이 헤더 역할) -->
                    <div class="card" style="background:transparent; box-shadow:none; padding:0; border:none;">
                        <div class="section-title" id="myTeamHeader" style="display:none;">🏆 내 팀</div>
                        <div id="myTeamBox"></div>
                    </div>
                </div>

                <!-- ── 중앙: 상태 + 진행 + 멤버 ───────────────────── -->
                <div id="centerColumn">
                    <div class="card">
                        <div id="draftStatusBox" class="draft-status">
                            <div class="current-text" id="currentText">로딩 중...</div>
                            <div class="draft-progress" id="draftProgress"></div>
                        </div>

                        <!-- 확정 버튼 영역 -->
                        <div id="confirmPickArea" class="confirm-pick-area" style="display:none;">
                            <div class="confirm-pick-label" id="confirmPickLabel">멤버를 선택해주세요</div>
                            <button class="btn" id="confirmPickBtn" disabled onclick="onConfirmPick()">✅ 픽 확정</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="section-title">📋 픽 가능한 멤버</div>
                        <div id="membersGrid" class="members-grid"></div>
                    </div>
                </div>

                <!-- ── 오른쪽: 상대 팀들 ───────────────────── -->
                <div id="rightColumn" class="split-grid-right">
                    <div class="card" style="background:transparent; box-shadow:none; padding:0; border:none;">
                        <div class="section-title" id="otherTeamHeader" style="display:none;">🤝 상대 팀</div>
                        <div id="otherTeamBox"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase + 공통 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // draft.html 로직
    // ========================================================================
    // 단계 O-2: N팀 (2/4/6/8) 호환 픽 로직
    //   - 2팀: 1-2-2-2-1 (8픽) - 기존 흐름
    //   - 4팀+: 스네이크 1-2-3-..-N-N-...-2-1 반복 (4 라운드, N팀*4픽)
    // ========================================================================

    let currentRoom = null;
    let currentDrafts = [];
    let currentTeams = [];   // N팀: teams 테이블 캐시
    let isProcessing = false;

    // 단계 E 변경: 후보 멤버 목록 (배열, 1명 또는 2명. 본인 연속 픽 수에 따라)
    let pendingPicks = [];

    // 단계 O-2: 동적 픽 시퀀스 계산
    // 2팀: ['A','B','B','A','A','B','B','A'] (A=먼저픽, B=나중픽)
    // N팀: [1,2,3,...,N, N,...,3,2,1, 1,2,3,...,N, N,...,3,2,1] (team_index 배열)
    function _isLineFixedMode() {
        // 라인고정 모드 — 멤버에 role 필드가 있으면 라인고정
        return !!(currentRoom && Array.isArray(currentRoom.members) && currentRoom.members.length > 0 && currentRoom.members[0].role !== undefined && currentRoom.members[0].role !== null);
    }

    function _buildPickSequence() {
        const teamCount = currentRoom.team_count || 2;

        // 단계 P-2: 라인고정 모드 — 8픽 (4라운드 × 2픽)
        //   ABAB 사용자 픽 + 각 픽마다 자동매칭 = 1=A선택, 2=B자동, 3=B선택, 4=A자동, 5=A선택, 6=B자동, 7=B선택, 8=A자동
        if (_isLineFixedMode() && teamCount === 2) {
            const pickerA = currentRoom.pick_order;
            const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';
            // pick_number: 1=A, 2=B(auto), 3=B, 4=A(auto), 5=A, 6=B(auto), 7=B, 8=A(auto)
            return [pickerA, pickerB, pickerB, pickerA, pickerA, pickerB, pickerB, pickerA];
        }

        if (teamCount === 2) {
            // 2팀 — 기존 1-2-2-2-1 패턴 + pick_order 매핑
            const pickerA = currentRoom.pick_order;
            const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';
            return ['A', 'B', 'B', 'A', 'A', 'B', 'B', 'A'].map(s => s === 'A' ? pickerA : pickerB);
        }
        // N팀 스네이크: 4 라운드, 각 라운드 N픽
        const posToTeamIdx = {};
        currentTeams.forEach(t => {
            if (t.pick_position) posToTeamIdx[t.pick_position] = t.team_index;
        });
        const seq = [];
        for (let round = 1; round <= 4; round++) {
            const ascending = (round % 2 === 1);
            for (let p = 1; p <= teamCount; p++) {
                const pos = ascending ? p : (teamCount - p + 1);
                seq.push(posToTeamIdx[pos] || null);
            }
        }
        return seq;
    }

    // 단계 P-2: 라인고정 모드 — 자동 매칭 픽인지 (사용자가 클릭 안 함)
    //   pick_number 2/4/6/8 (짝수)는 자동, 1/3/5/7 (홀수)는 사용자 선택
    function _isAutoPick(pickNumber) {
        if (!_isLineFixedMode()) return false;
        return pickNumber % 2 === 0;
    }

    function _getTotalPicks() {
        // 단계 P-2: 라인고정 모드 — 8픽 (사용자 4번 + 자동매칭 4번)
        if (_isLineFixedMode() && (currentRoom.team_count || 2) === 2) return 8;
        return (currentRoom.team_count || 2) * 4;
    }

    function _getMyPickerToken() {
        // 2팀: ROLE ('leader1'/'leader2'). N팀: team_index (1..8)
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) return ROLE;
        return getMyTeamIndex();
    }

    function _isMyTurnNow() {
        const pickCount = currentDrafts.length;
        if (pickCount >= _getTotalPicks()) return false;
        // 단계 P-2: 라인고정 모드 — 다음 픽이 자동매칭이면 사용자 차례 아님
        const nextPickNumber = pickCount + 1;
        if (_isAutoPick(nextPickNumber)) return false;
        const seq = _buildPickSequence();
        const expected = seq[pickCount];
        return expected === _getMyPickerToken();
    }

    // 본인 차례에서 연속으로 픽할 수 있는 수
    function _getMyAllowedPicks() {
        const pickCount = currentDrafts.length;
        const total = _getTotalPicks();
        if (pickCount >= total) return 0;
        // 단계 P-2: 라인고정 모드 — 한 번에 1픽만 (다음은 자동매칭)
        if (_isLineFixedMode()) return 1;
        const seq = _buildPickSequence();
        const myToken = _getMyPickerToken();
        let count = 0;
        for (let i = pickCount; i < total; i++) {
            if (seq[i] !== myToken) break;
            count++;
        }
        return count;
    }

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 단계 O: N팀 모드면 teams 캐시 미리 로드
        if (currentRoom.team_count && currentRoom.team_count > 0) {
            try {
                const _c = initSupabase();
                const { data: _teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                if (_teams) setTeamsCache(_teams);
            } catch (e) { console.warn('teams load failed:', e); }
        }

        // 단계 L: 팀장 잠금 — "본인이 맞으십니까?" 확인 + claim
        const claimed = await ensureLeaderClaim(currentRoom);
        if (!claimed) return;  // 거부 시 ensureLeaderClaim이 화면 교체함

        // 상태 검증 — drafting이 아니면 main으로 (라우팅이 알아서 처리)
        if (currentRoom.status !== 'drafting') {
            goToMain();
            return;
        }

        // 단계 O-2: N팀에선 currentRoom.pick_order가 없음. 대신 teams.pick_position 사용.
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            // 2팀: 기존대로 pick_order 확인
            if (!currentRoom.pick_order) {
                goToMain();
                return;
            }
        } else {
            // N팀: teams 테이블 로드 (pick_position 확인)
            try {
                const _c = initSupabase();
                const { data: teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                currentTeams = teams || [];
                setTeamsCache(currentTeams);
                // 모든 팀의 pick_position이 정해졌는지
                const allHavePos = currentTeams.length === teamCount
                    && currentTeams.every(t => t.pick_position);
                if (!allHavePos) {
                    goToMain();
                    return;
                }
            } catch (e) {
                showFatalError('팀 정보 로드 실패: ' + (e && e.message ? e.message : e));
                return;
            }
        }

        // 드래프트 픽 로드
        currentDrafts = await loadDrafts();

        // 헤더
        const totalPicks = teamCount * 4;
        const seqLabel = teamCount === 2 ? '1-2-2-2-1' : (teamCount + '팀 스네이크');
        renderHeader(currentRoom,
            '⚔️ STEP 2: 드래프트 진행',
            `${seqLabel} 순서로 ${totalPicks}픽 진행합니다.`
        );

        // 실시간 구독
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                // 다음 단계로 넘어갔으면 라우팅
                if (currentRoom.status === 'rps2') {
                    goToRps(2);
                } else if (currentRoom.status === 'done') {
                    goToDone();
                } else if (currentRoom.status === 'matchup_pending') {
                    // 단계 O-2: N팀 — 모든 픽 끝나면 매칭 결정 대기 화면으로
                    goToMain();
                } else if (currentRoom.status === 'side_rps') {
                    // 단계 O-2: N팀 — 매칭 결정 끝, 진영 가위바위보 페이지로
                    goToSide();
                }
            },
            onDraft: async () => {
                currentDrafts = await loadDrafts();
                renderDraft();
            }
        });

        hide('loadingView');
        show('draftView');
        renderDraft();
    })();

    // ========================================================================
    // 단계 E 변경: 다중 후보 선택 (1-2명 차례에 맞게)
    // ========================================================================
    function onMemberSelect(memberName) {
        if (!_isMyTurnNow()) return;
        const pickedMap = _buildPickedMap();
        if (pickedMap[memberName]) return;

        const allowed = _getMyAllowedPicks();
        const idx = pendingPicks.indexOf(memberName);

        if (idx !== -1) {
            // 이미 선택된 멤버 → 해제
            pendingPicks.splice(idx, 1);
        } else if (pendingPicks.length < allowed) {
            // 새로 추가
            pendingPicks.push(memberName);
        } else {
            showToast(`이번 차례는 ${allowed}명까지만 선택 가능합니다.\n다른 선택을 해제하고 골라주세요.`);
            return;
        }
        renderDraft();
    }

    // ========================================================================
    // 단계 E: [확정] 버튼 — 선택한 멤버들을 순서대로 RPC 호출
    // ========================================================================
    async function onConfirmPick() {
        if (isProcessing) return;
        if (pendingPicks.length === 0) return;
        if (!_isMyTurnNow()) return;

        // 이중 확인: 후보들이 그 사이에 이미 픽됐는지
        const pickedMap = _buildPickedMap();
        const stillAvailable = pendingPicks.filter(m => !pickedMap[m]);
        if (stillAvailable.length < pendingPicks.length) {
            showToast('일부 멤버가 이미 픽되었습니다. 다시 선택해주세요.');
            pendingPicks = stillAvailable;
            renderDraft();
            return;
        }

        isProcessing = true;
        const btn = $('confirmPickBtn');
        if (btn) { btn.disabled = true; btn.innerText = '⏳ 확정 중...'; }

        const toSubmit = [...pendingPicks];
        let successCount = 0;

        try {
            const client = initSupabase();
            // 단계 O-2: team_count에 따라 RPC 분기
            // 단계 P-2: 라인고정 모드면 make_draft_pick_line_fixed
            let rpcName;
            if (_isLineFixedMode()) {
                rpcName = 'make_draft_pick_line_fixed';
            } else if (currentRoom.team_count && currentRoom.team_count > 2) {
                rpcName = 'make_team_draft_pick';
            } else {
                rpcName = 'make_draft_pick';
            }
            for (let i = 0; i < toSubmit.length; i++) {
                const m = toSubmit[i];
                const { data, error } = await client.rpc(rpcName, {
                    p_room_code: ROOM_CODE,
                    p_leader_token: TOKEN,
                    p_member_name: m
                });
                if (error) {
                    showToast('오류: ' + error.message);
                    break;
                }
                if (data && data[0] && !data[0].success) {
                    showToast(data[0].message || '픽 실패');
                    break;
                }
                successCount++;
            }
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
        }

        if (successCount > 0) {
            // 단계 O-3 (fix #1): 픽 완료 toast 제거 — 화면에 이미 결과가 보이므로 불필요
            // const submittedNames = toSubmit.slice(0, successCount).join(', ');
            // showToast(submittedNames + ' 픽 완료!');
        }
        pendingPicks = [];
        currentDrafts = await loadDrafts();
        isProcessing = false;
        const btn2 = $('confirmPickBtn');
        if (btn2) btn2.innerText = '✅ 픽 확정';
        renderDraft();
    }

    // ── 단계 E 헬퍼들 ───────────────────────────────────────────────────────
    function _buildPickedMap() {
        const map = {};
        currentDrafts.forEach(d => { map[d.picked_member] = d.picker; });
        return map;
    }
    // _isMyTurnNow, _getMyAllowedPicks 는 위에서 정의됨 (단계 O-2 N팀 호환)

    // ========================================================================
    // 렌더링
    // ========================================================================
    function renderDraft() {
        const pickCount = currentDrafts.length;
        const nextPickNumber = pickCount + 1;
        const totalPicks = _getTotalPicks();
        const seq = _buildPickSequence();

        // 다음 픽 차례 (token: 2팀='leader1'/'leader2', N팀=team_index)
        let expectedPicker = null;
        if (pickCount < totalPicks) {
            expectedPicker = seq[pickCount];
        }
        const isMyTurn = (expectedPicker === _getMyPickerToken());
        const isDone = pickCount >= totalPicks;

        // 단계 E: pendingPicks 중 invalid한 항목 자동 제거
        if (pendingPicks.length > 0) {
            const pickedMap = _buildPickedMap();
            if (!isMyTurn) {
                pendingPicks = [];
            } else {
                pendingPicks = pendingPicks.filter(m => !pickedMap[m]);
            }
        }

        // 상태 박스
        const statusBox = $('draftStatusBox');
        const currentText = $('currentText');
        if (isDone) {
            statusBox.className = 'draft-status done';
            currentText.innerText = '✅ 드래프트 완료! 다음 단계로 이동 중...';
        } else if (isMyTurn) {
            statusBox.className = 'draft-status my-turn';
            currentText.innerText = `🔥 내 차례! (${nextPickNumber}픽 / 총 ${totalPicks}픽)`;
        } else {
            statusBox.className = 'draft-status';
            const otherName = _getDisplayNameForToken(expectedPicker);
            currentText.innerText = `⏳ ${otherName}의 차례 (${nextPickNumber}픽 / 총 ${totalPicks}픽)`;
        }

        // 진행 슬롯
        renderProgress(pickCount, seq);

        // 멤버 그리드
        renderMembers(isMyTurn);

        // 단계 D 추가: 확정 영역 갱신
        renderConfirmArea(isMyTurn);

        // 팀 구성
        renderTeams();
    }

    // 단계 O-2: token에 따른 표시 이름
    function _getDisplayNameForToken(token) {
        if (!token) return '?';
        // 2팀 ('leader1'/'leader2')
        if (token === 'leader1') return currentRoom.leader1_name || '팀장 1';
        if (token === 'leader2') return currentRoom.leader2_name || '팀장 2';
        // N팀 (team_index)
        if (typeof token === 'number') {
            const team = currentTeams.find(t => t.team_index === token);
            return team ? (team.leader_name || ('팀장 ' + token)) : ('팀장 ' + token);
        }
        return String(token);
    }

    // 단계 E: 확정 영역 갱신 (다중 픽 지원)
    function renderConfirmArea(isMyTurn) {
        const area = $('confirmPickArea');
        const label = $('confirmPickLabel');
        const btn = $('confirmPickBtn');
        if (!area || !label || !btn) return;

        if (!isMyTurn) {
            area.style.display = 'none';
            return;
        }

        area.style.display = 'block';
        const allowed = _getMyAllowedPicks();

        if (pendingPicks.length === 0) {
            const hint = allowed > 1 ? `${allowed}명 동시 선택 가능` : '';
            label.innerText = `💡 멤버를 선택한 뒤 [픽 확정]을 눌러주세요${hint ? ' (' + hint + ')' : ''}`;
            btn.disabled = true;
        } else {
            const escapedNames = pendingPicks.map(escapeHtml).join(', ');
            label.innerHTML = `선택한 멤버 (${pendingPicks.length}/${allowed}): <span class="pick-name">${escapedNames}</span>`;
            btn.disabled = isProcessing;
        }
    }

    function renderProgress(pickCount, seq) {
        const html = [];
        const totalPicks = _getTotalPicks();
        for (let i = 0; i < totalPicks; i++) {
            const owner = seq[i]; // 2팀: 'leader1'/'leader2', N팀: team_index (1..8)
            const done = i < pickCount;
            const current = i === pickCount;

            let cls = 'pick-slot';
            // 단계 O-2: 2팀은 기존 클래스 ('leader1'/'leader2'), N팀은 'team-N'
            const ownerClass = (typeof owner === 'number') ? ('team-' + owner) : owner;
            if (done) {
                cls += ` done ${ownerClass}`;
            } else if (current) {
                cls += ' current';
            }

            // 단계 O-3 (fix): 본인 팀 픽 슬롯에 .is-mine 클래스 추가 (살짝 다른 색상)
            let isMine = false;
            if (typeof owner === 'number') {
                // N팀: getMyTeamIndex와 비교
                isMine = (owner === getMyTeamIndex());
            } else {
                // 2팀: ROLE과 비교
                isMine = (owner === ROLE);
            }
            if (isMine) cls += ' is-mine';

            // 라벨: 어느 팀이 픽하는지 표시
            let actualTeam;
            if (typeof owner === 'number') {
                actualTeam = owner + '팀';
            } else {
                actualTeam = owner === 'leader1' ? '1팀' : '2팀';
            }

            // 단계 P-2: 라인고정 모드 — 자동 픽 슬롯 표시 (작은 🤖)
            const pickNumber = i + 1;
            const isAuto = _isAutoPick(pickNumber);
            const slotContent = isAuto ? '🤖' : pickNumber;
            const labelExtra = isAuto ? '<br><span style="font-size:10px; color:#9ca3af;">자동</span>' : '';

            html.push(`
                <div class="pick-slot-wrap${isMine ? ' is-mine-wrap' : ''}${isAuto ? ' is-auto-wrap' : ''}">
                    <div class="${cls}">${slotContent}</div>
                    <div class="pick-slot-label">${actualTeam}${labelExtra}</div>
                </div>
            `);
        }
        $('draftProgress').innerHTML = html.join('');
    }

    function renderMembers(isMyTurn) {
        const members = currentRoom.members || [];
        const pickedMap = {};
        currentDrafts.forEach(d => { pickedMap[d.picked_member] = d.picker; });
        // 단계 O-2: picker_team_index 매핑도 함께
        const pickedTeamMap = {};
        currentDrafts.forEach(d => { pickedTeamMap[d.picked_member] = d.picker_team_index; });

        const teamCount = currentRoom.team_count || 2;
        const isNTeam = teamCount > 2;
        const myName = getMyDisplayName(currentRoom);

        // 단계 O-2: 팀장 이름 집합 (2팀+N팀 모두 호환)
        const leaderNameToTeamIdx = {};
        if (isNTeam) {
            currentTeams.forEach(t => { leaderNameToTeamIdx[t.leader_name] = t.team_index; });
        } else {
            leaderNameToTeamIdx[currentRoom.leader1_name] = 1;
            leaderNameToTeamIdx[currentRoom.leader2_name] = 2;
        }

        const grid = $('membersGrid');
        grid.innerHTML = '';

        // 단계 O-3 (fix #3): 픽된 멤버 + 팀장은 왼쪽 그리드에서 제외 (오른쪽 팀 박스에서 볼 수 있음)
        const visibleMembers = members.filter(rawM => {
            const memberName = (rawM && typeof rawM === 'object') ? (rawM.name || '') : String(rawM);
            if (!memberName) return false;
            if (leaderNameToTeamIdx[memberName] !== undefined) return false; // 팀장 제외
            if (pickedMap[memberName]) return false; // 이미 픽된 멤버 제외
            return true;
        });

        if (visibleMembers.length === 0) {
            grid.innerHTML = `<div style="text-align:center; color:#6b7280; padding:30px 12px; font-size:13px;">
                모든 멤버가 픽되었습니다.<br>
                <span style="color:#9ca3af; font-size:11px;">다음 단계를 기다려주세요.</span>
            </div>`;
            return;
        }

        // 단계 P-3: 라인고정 모드면 라인별 그룹화 (가로 5컬럼)
        const isLineFixed = _isLineFixedMode();
        const _LINE_LABELS_DR = ['탑', '정글', '미드', '원딜', '서폿'];
        if (isLineFixed) {
            document.body.classList.add('line-fixed-mode-draft');
            const byLine = [[], [], [], [], []];
            visibleMembers.forEach(m => {
                const r = (m && m.role !== undefined && m.role !== null) ? m.role : -1;
                if (r >= 0 && r <= 4) byLine[r].push(m);
            });

            // 단계 P-3: 팀장 라인 찾기 (members 풀에 없는 라인 = 팀장 라인)
            //   팀장 라인 컬럼은 멤버 없으니 좁게, 나머지 4컬럼 넓게
            let leaderLineForGrid = -1;
            const allMembers = members; // 위에서 정의된 currentRoom.members
            const linesPresent = new Set();
            allMembers.forEach(m => {
                if (m && m.role !== undefined && m.role !== null) linesPresent.add(m.role);
            });
            for (let i = 0; i < 5; i++) {
                if (!linesPresent.has(i)) { leaderLineForGrid = i; break; }
            }

            // 5 컬럼 가로 grid — 팀장 라인 컬럼은 0.4fr (좁게), 나머지 1fr
            const colTemplate = [];
            for (let i = 0; i < 5; i++) {
                colTemplate.push(i === leaderLineForGrid ? '0.5fr' : '1fr');
            }
            grid.style.cssText = `display: grid; grid-template-columns: ${colTemplate.join(' ')}; gap: 8px;`;
            for (let i = 0; i < 5; i++) {
                const col = document.createElement('div');
                col.style.cssText = 'display: flex; flex-direction: column; gap: 4px; min-width: 0;';
                // 라인 헤더
                const header = document.createElement('div');
                header.style.cssText = 'text-align:center; font-weight:800; font-size:11px; padding:5px 4px; background:linear-gradient(135deg, #4338ca, #6366f1); color:#fff; border-radius:5px; margin-bottom:3px;';
                header.innerText = _LINE_LABELS_DR[i];
                col.appendChild(header);
                if (i === leaderLineForGrid) {
                    // 팀장 라인 — "팀장 라인" 표시만
                    const note = document.createElement('div');
                    note.style.cssText = 'font-size:10px; color:#9ca3af; text-align:center; font-style:italic; padding:8px 2px;';
                    note.innerText = '팀장 라인';
                    col.appendChild(note);
                } else if (byLine[i].length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'font-size:10px; color:#9ca3af; text-align:center; font-style:italic; padding:8px;';
                    empty.innerText = '완료';
                    col.appendChild(empty);
                } else {
                    byLine[i].forEach(rawM => {
                        const btn = _buildMemberBtn(rawM, isMyTurn);
                        col.appendChild(btn);
                    });
                }
                grid.appendChild(col);
            }
            return;
        }

        // 단계 I: members가 객체 배열 {name, score}
        visibleMembers.forEach(rawM => {
            const btn = _buildMemberBtn(rawM, isMyTurn);
            grid.appendChild(btn);
        });
    }

    // 단계 P-3: 멤버 버튼 생성 helper
    function _buildMemberBtn(rawM, isMyTurn) {
        const memberName = (rawM && typeof rawM === 'object') ? (rawM.name || '') : String(rawM);
        const memberScore = (rawM && typeof rawM === 'object') ? rawM.score : null;

        const btn = document.createElement('button');
        btn.className = 'member-btn';
        btn.type = 'button';

        const scoreHtml = (memberScore !== null && memberScore !== undefined && memberScore !== '')
            ? `<span class="member-score-badge">${memberScore}</span>` : '';

        // 단계 P-3: 점수 뱃지를 이름 옆 (분리된 영역) — flex space-between
        const innerHtml = `<span class="member-name-wrap">${escapeHtml(memberName)}</span>${scoreHtml}`;

        if (isMyTurn) {
            btn.innerHTML = innerHtml;
            const orderIdx = pendingPicks.indexOf(memberName);
            if (orderIdx !== -1) {
                btn.classList.add('is-selected');
                const badge = document.createElement('span');
                badge.className = 'selected-badge';
                badge.innerText = _getMyAllowedPicks() > 1 ? String(orderIdx + 1) : '✓';
                btn.appendChild(badge);
            }
            btn.onclick = () => onMemberSelect(memberName);
        } else {
            btn.innerHTML = innerHtml;
            btn.disabled = true;
        }
        return btn;
    }

    // 단계 E: 새 레이아웃 — 내 팀 (위) / 상대 팀 (아래)
    // 단계 O-2: N팀이면 split-grid-right를 N팀 그리드로 완전 교체
    function renderTeams() {
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            renderTeams2();
        } else {
            renderTeamsN();
        }
    }

    // 단계 P-3: 라인고정 모드 — 픽 가능한 멤버 카드를 grid 바깥(아래)으로 이동
    //   전체 폭 사용해서 5컬럼 라인별 그리드가 충분히 펼쳐지도록
    function _moveMemberCardBelowGrid() {
        const memberCard = document.getElementById('membersGrid');
        if (!memberCard) return;
        const memberCardWrapper = memberCard.closest('.card');
        if (!memberCardWrapper) return;
        const grid = document.querySelector('.draft-3col-grid');
        if (!grid) return;
        const pageWrap = grid.parentNode;
        if (!pageWrap) return;

        // 이미 grid 바깥에 있으면 skip
        if (memberCardWrapper.dataset.movedBelow === '1') return;

        // grid 바로 뒤에 삽입
        if (grid.nextSibling) {
            pageWrap.insertBefore(memberCardWrapper, grid.nextSibling);
        } else {
            pageWrap.appendChild(memberCardWrapper);
        }
        memberCardWrapper.dataset.movedBelow = '1';
        memberCardWrapper.style.marginTop = '12px';
    }

    function _restoreMemberCardToCenter() {
        const memberCard = document.getElementById('membersGrid');
        if (!memberCard) return;
        const memberCardWrapper = memberCard.closest('.card');
        if (!memberCardWrapper) return;
        if (memberCardWrapper.dataset.movedBelow !== '1') return;

        const centerColumn = document.getElementById('centerColumn');
        if (centerColumn) {
            centerColumn.appendChild(memberCardWrapper);
            memberCardWrapper.dataset.movedBelow = '';
            memberCardWrapper.style.marginTop = '';
        }
    }

    function renderTeams2() {
        // 단계 P-3: 라인고정 모드 감지 (위에서 사용)
        const isLineFixedForLayout = _isLineFixedMode();

        // 단계 O-3 (fix): 2팀 모드 → nteam 클래스 제거 + 인라인 스타일 reset
        document.body.classList.remove('nteam-mode', 'nteam-mode-large');
        const pageWrap = document.querySelector('.page-wrap');
        const grid = document.querySelector('.draft-3col-grid');
        if (isLineFixedForLayout) {
            // 라인고정 2팀 — 페이지 폭 확장 (5컬럼 멤버 그리드 보이도록)
            if (pageWrap) pageWrap.style.maxWidth = 'min(1800px, 98vw)';
            if (grid) {
                grid.style.gridTemplateColumns = '1fr 1fr 1fr';  // 균등 3컬럼
                grid.style.gap = '12px';
            }
            // 픽 가능한 멤버 카드를 grid 바깥(아래)으로 이동 → 전체 폭 사용
            _moveMemberCardBelowGrid();
        } else {
            if (pageWrap) pageWrap.style.maxWidth = '';
            if (grid) {
                grid.style.gridTemplateColumns = '';
                grid.style.gap = '';
            }
            _restoreMemberCardToCenter();
        }

        // 기존 2팀 흐름 — myTeamBox(왼쪽), otherTeamBox(오른쪽)
        const isLineFixedLabel = _isLineFixedMode();
        const myTeamLabel = isLineFixedLabel ? '내 팀' : (ROLE === 'leader1' ? '1팀' : '2팀');
        const otherTeamLabel = isLineFixedLabel ? '상대 팀' : (ROLE === 'leader1' ? '2팀' : '1팀');
        const myLeaderName = ROLE === 'leader1' ? currentRoom.leader1_name : currentRoom.leader2_name;
        const otherLeaderName = ROLE === 'leader1' ? currentRoom.leader2_name : currentRoom.leader1_name;
        const myLeaderScore = ROLE === 'leader1' ? currentRoom.leader1_score : currentRoom.leader2_score;
        const otherLeaderScore = ROLE === 'leader1' ? currentRoom.leader2_score : currentRoom.leader1_score;
        const myRole = ROLE;
        const otherRole = ROLE === 'leader1' ? 'leader2' : 'leader1';

        const myPicks = currentDrafts.filter(d => d.picker === myRole).map(d => d.picked_member);
        const otherPicks = currentDrafts.filter(d => d.picker === otherRole).map(d => d.picked_member);

        // 단계 O-3 fix #1: 오른쪽 컨테이너를 기본 (2팀) 형태로 복원
        _ensureRightContainerDefault();

        // 단계 O-3 (fix #6): myTeamHeader/otherTeamHeader 제거 (team-vbox-title이 대체)
        const myHeader = $('myTeamHeader');
        if (myHeader) myHeader.style.display = 'none';
        const otherHeader = $('otherTeamHeader');
        if (otherHeader) otherHeader.style.display = 'none';

        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        const roleMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) {
                scoreMap[m.name] = m.score;
                if (m.role !== undefined && m.role !== null) roleMap[m.name] = m.role;
            }
        });

        const scoreBadge = (sc) => (sc !== null && sc !== undefined && sc !== '')
            ? `<span class="member-score-badge">${sc}</span>` : '';

        // 단계 P-3: 라인고정 모드 — 라인 순서대로 표시 (탑→정글→미드→원딜→서폿)
        const isLineFixed = _isLineFixedMode();
        const _LL = ['탑', '정글', '미드', '원딜', '서폿'];

        // 라인고정 모드 — 팀장 라인 추론 (members 풀에 없는 1라인 = 팀장 공통 라인)
        let leaderLine = -1;
        if (isLineFixed) {
            const linesInMembers = new Set();
            members.forEach(m => {
                if (m && m.role !== undefined && m.role !== null) linesInMembers.add(m.role);
            });
            for (let i = 0; i < 5; i++) {
                if (!linesInMembers.has(i)) { leaderLine = i; break; }
            }
        }

        // 단계 O-3 (fix #6): 사진 2 디자인 — team-vbox로 통합
        const buildBox = (teamLabel, leaderName, leaderScore, picks, isOpponent) => {
            // 합산 점수
            const total = (Number(leaderScore) || 0) + picks.reduce((s, n) => s + (Number(scoreMap[n]) || 0), 0);
            const count = 1 + picks.length;
            let html = `<div class="team-vbox${isOpponent ? ' opponent' : ''}">
                <div class="team-vbox-title">${teamLabel}<span class="small">합산 ${total}점 (${count}명)</span></div>`;

            if (isLineFixed) {
                // 라인고정 — 5 슬롯 (탑/정글/미드/원딜/서폿) 라인 순서로
                const slots = new Array(5).fill(null);
                if (leaderLine >= 0) {
                    slots[leaderLine] = { type: 'leader', name: leaderName, score: leaderScore };
                }
                picks.forEach(n => {
                    const r = roleMap[n];
                    if (r !== undefined && r >= 0 && r < 5 && !slots[r]) {
                        slots[r] = { type: 'member', name: n, score: scoreMap[n] };
                    }
                });
                for (let i = 0; i < 5; i++) {
                    const linePrefix = `<span style="font-size:10px; color:#4338ca; font-weight:800; min-width:32px; display:inline-block; margin-right:6px;">${_LL[i]}</span>`;
                    if (!slots[i]) {
                        html += `<div class="team-vbox-row empty">${linePrefix}<span>(픽 대기)</span></div>`;
                    } else if (slots[i].type === 'leader') {
                        html += `<div class="team-vbox-row leader">${linePrefix}<span>👑 ${escapeHtml(slots[i].name || '(미정)')}</span>${scoreBadge(slots[i].score)}</div>`;
                    } else {
                        html += `<div class="team-vbox-row">${linePrefix}<span>${escapeHtml(slots[i].name)}</span>${scoreBadge(slots[i].score)}</div>`;
                    }
                }
            } else {
                html += `<div class="team-vbox-row leader"><span>👑 ${escapeHtml(leaderName || '(미정)')}</span>${scoreBadge(leaderScore)}</div>`;
                for (let i = 0; i < 4; i++) {
                    if (i < picks.length) {
                        const sc = scoreMap[picks[i]];
                        html += `<div class="team-vbox-row"><span>${escapeHtml(picks[i])}</span>${scoreBadge(sc)}</div>`;
                    } else {
                        html += `<div class="team-vbox-row empty"><span>(픽 대기)</span></div>`;
                    }
                }
            }
            html += `</div>`;
            return html;
        };

        $('myTeamBox').innerHTML = buildBox(myTeamLabel, myLeaderName, myLeaderScore, myPicks, false);
        $('otherTeamBox').innerHTML = buildBox(otherTeamLabel, otherLeaderName, otherLeaderScore, otherPicks, true);
    }

    function _ensureRightContainerDefault() {
        // 오른쪽 컨테이너에 otherTeamBox가 있는지 확인 (N팀 후 2팀으로 돌아가는 경우 등)
        const right = document.querySelector('.split-grid-right');
        if (!right) return;
        if (!$('otherTeamBox')) {
            right.innerHTML = `
                <div class="card" style="background:transparent; box-shadow:none; padding:0; border:none;">
                    <div class="section-title" id="otherTeamHeader" style="display:none;">🤝 상대 팀</div>
                    <div id="otherTeamBox"></div>
                </div>
            `;
        }
    }

    function renderTeamsN() {
        // 단계 O-3 fix #1: 내 팀은 왼쪽 myTeamBox, 상대 팀들은 오른쪽 그리드
        const teamCount = currentRoom.team_count;
        const myIdx = getMyTeamIndex();

        // 단계 O-3 (fix): N팀 모드 body 클래스 — 오른쪽 컬럼 넓게
        document.body.classList.add('nteam-mode');
        if (teamCount >= 6) document.body.classList.add('nteam-mode-large');

        // 단계 O-3 (fix): 인라인 스타일로 강제 적용 (CSS 캐시 무관하게 즉시 반영)
        const pageWrap = document.querySelector('.page-wrap');
        const grid = document.querySelector('.draft-3col-grid');
        if (pageWrap) {
            if (teamCount >= 6) {
                pageWrap.style.maxWidth = 'min(1900px, 98vw)';
            } else if (teamCount >= 4) {
                pageWrap.style.maxWidth = 'min(1800px, 96vw)';
            }
        }
        if (grid) {
            if (teamCount >= 6) {
                // 단계 P-3 (fix): 8팀 모드 — 내 팀 더 넓게 + 픽 영역 넓게 + 상대 팀 컴팩트
                grid.style.gridTemplateColumns = '1.7fr 2fr 2.3fr';
                grid.style.gap = '12px';
            } else if (teamCount >= 4) {
                grid.style.gridTemplateColumns = '1.4fr 1.5fr 1.8fr';
                grid.style.gap = '12px';
            }
        }

        // members 점수 맵
        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) scoreMap[m.name] = m.score;
        });
        currentTeams.forEach(t => { if (t.leader_name) scoreMap[t.leader_name] = t.leader_score; });

        const scoreBadge = (sc) => (sc !== null && sc !== undefined && sc !== '')
            ? `<span class="member-score-badge">${sc}</span>` : '';

        // 헤더 숨김 (team-vbox-title이 대체)
        const myHeader = $('myTeamHeader');
        if (myHeader) myHeader.style.display = 'none';
        const otherHeader = $('otherTeamHeader');
        if (otherHeader) otherHeader.style.display = 'none';

        // 단계 O-3 (fix #6): 통일된 team-vbox 빌더
        const buildBoxHtml = (team, isOpponent) => {
            const picks = currentDrafts.filter(d => d.picker_team_index === team.team_index)
                                        .sort((a, b) => a.pick_number - b.pick_number);
            const total = (team.leader_score || 0) + picks.reduce((s, p) => s + (Number(scoreMap[p.picked_member]) || 0), 0);
            const count = 1 + picks.length;
            let html = `<div class="team-vbox${isOpponent ? ' opponent' : ''}">
                <div class="team-vbox-title">${team.team_index}팀<span class="small">합산 ${total}점 (${count}명)</span></div>
                <div class="team-vbox-row leader"><span>👑 ${escapeHtml(team.leader_name || '?')}</span>${scoreBadge(team.leader_score)}</div>`;
            for (let i = 0; i < 4; i++) {
                if (i < picks.length) {
                    html += `<div class="team-vbox-row"><span>${escapeHtml(picks[i].picked_member)}</span>${scoreBadge(scoreMap[picks[i].picked_member])}</div>`;
                } else {
                    html += `<div class="team-vbox-row empty"><span>(픽 대기)</span></div>`;
                }
            }
            html += `</div>`;
            return html;
        };

        // 1) 왼쪽: 내 팀 (myTeamBox 안에 team-vbox)
        const myTeam = currentTeams.find(t => t.team_index === myIdx);
        if (myTeam && $('myTeamBox')) {
            $('myTeamBox').innerHTML = buildBoxHtml(myTeam, false);
        }

        // 2) 오른쪽: 상대 팀들 (split-grid-right 통째로 교체)
        //    단계 O-3 (fix): 사용자 요청 — 6/8팀일 때 2열 (1팀/2팀, 3팀/4팀, 5팀/6팀, 7팀/8팀)
        //    본인 팀 자리는 placeholder로 표시 ("내 팀" — 왼쪽에서 보고 있으니 빈 박스)
        const right = document.querySelector('.split-grid-right');
        if (!right) return;

        const tc = currentRoom.team_count || 2;
        let html = '';
        if (tc >= 4) {
            // 2열 그리드 — team_index 순서 (1,2 / 3,4 / 5,6 / 7,8)
            const sortedTeams = [...currentTeams].sort((a, b) => a.team_index - b.team_index);
            html = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">`;
            sortedTeams.forEach(t => {
                if (t.team_index === myIdx) {
                    // 본인 팀 placeholder
                    html += `<div class="team-vbox opponent" style="opacity:0.4; display:flex; align-items:center; justify-content:center; min-height:160px;">
                        <div style="text-align:center; color:#9ca3af; font-size:13px; font-weight:700;">
                            👈 내 팀<br><span style="font-size:10px; font-weight:500;">왼쪽에서 확인</span>
                        </div>
                    </div>`;
                } else {
                    html += buildBoxHtml(t, true);
                }
            });
            html += `</div>`;
        } else {
            // 2팀 모드 (1열)
            const otherTeams = currentTeams.filter(t => t.team_index !== myIdx);
            html = `<div style="display:grid; grid-template-columns:1fr; gap:6px;">`;
            otherTeams.forEach(t => { html += buildBoxHtml(t, true); });
            html += `</div>`;
        }
        right.innerHTML = html;
    }
    </script>
</body>
</html>
