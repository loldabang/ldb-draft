<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드래프트 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        /* 페이지 전용 스타일 */
        .draft-status {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            padding: 18px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            transition: background 0.3s;
        }
        .draft-status.my-turn {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            animation: pulse 1.5s ease-in-out infinite;
        }
        .draft-status.done {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
        }
        .draft-status .current-text {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 8px;
        }

        /* 진행 슬롯 (1~8) */
        .draft-progress {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pick-slot {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 800;
            color: #6b7280;
            position: relative;
        }
        .pick-slot.done.leader1 {
            background: var(--team1-color);
            color: #fff;
        }
        .pick-slot.done.leader2 {
            background: var(--team2-color);
            color: #fff;
        }
        .pick-slot.current {
            background: var(--warning);
            color: #fff;
            animation: pulse 1s ease-in-out infinite;
        }
        .pick-slot-label {
            font-size: 9px;
            margin-top: 2px;
            color: var(--text-muted);
            text-align: center;
            min-height: 12px;
        }
        .pick-slot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        /* 멤버 그리드 — 단계 F: 1열로 (왼쪽에 세로로 쭈욱) */
        .members-section {
            margin-top: 0;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .members-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .member-btn {
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Pretendard', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .member-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .member-btn:disabled {
            cursor: not-allowed;
        }
        .member-btn.picked-leader1 {
            background: var(--team1-bg);
            border-color: var(--team1-color);
            color: var(--team1-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn.picked-leader2 {
            background: var(--team2-bg);
            border-color: var(--team2-color);
            color: var(--team2-text);
            opacity: 0.65;
            position: relative;
        }
        .member-btn .pick-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(0,0,0,0.07);
            flex-shrink: 0;
        }
        .member-btn.is-leader {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            border-style: dashed;
            cursor: not-allowed;
            color: var(--text-muted);
        }
        .member-btn.is-leader.is-mine {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-color: var(--warning);
            border-style: solid;
            color: #92400e;
        }
        .member-btn.is-leader .leader-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            background: rgba(0,0,0,0.07);
            flex-shrink: 0;
        }

        /* 후보로 선택된 멤버 (확정 전) */
        .member-btn.is-selected {
            border-color: var(--warning);
            border-width: 3px;
            background: linear-gradient(135deg, #fff7ed, #ffedd5);
            color: #9a3412;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.28);
        }
        .member-btn .selected-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            background: var(--warning);
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        /* 단계 D 추가: 확정 버튼 영역 */
        .confirm-pick-area {
            margin-top: 18px;
            padding: 14px;
            background: linear-gradient(135deg, #fffbeb, #fef3c7);
            border: 2px dashed var(--warning);
            border-radius: 12px;
            text-align: center;
        }
        .confirm-pick-area .confirm-pick-label {
            font-size: 13px;
            color: #78350f;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .confirm-pick-area .confirm-pick-label .pick-name {
            color: #92400e;
            font-size: 15px;
            font-weight: 800;
        }
        #confirmPickBtn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            background: var(--warning);
            color: #fff;
        }
        #confirmPickBtn:hover:not(:disabled) {
            background: #ea580c;
        }
        #confirmPickBtn:disabled {
            background: #d1d5db;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="page-wrap" style="max-width: 1100px;">
        <!-- 헤더 -->
        <div id="headerArea"></div>

        <!-- 로딩 -->
        <div id="loadingView" class="card loading">
            <div class="spinner"></div>
            <div class="loading-text">드래프트 정보 불러오는 중...</div>
        </div>

        <!-- 드래프트 본문 -->
        <div id="draftView" style="display:none;">
            <!-- 2단 그리드: 왼쪽 = 상태+멤버+내팀 / 오른쪽 = 상대팀들 -->
            <div class="split-grid">
                <!-- 왼쪽: 상태 + 진행 + 픽 가능 멤버 + 내 팀 -->
                <div>
                    <!-- 상태 + 진행 -->
                    <div class="card">
                        <div id="draftStatusBox" class="draft-status">
                            <div class="current-text" id="currentText">로딩 중...</div>
                            <div class="draft-progress" id="draftProgress"></div>
                        </div>

                        <!-- 단계 D/E: 확정 버튼 영역 (본인 차례일 때만) -->
                        <div id="confirmPickArea" class="confirm-pick-area" style="display:none;">
                            <div class="confirm-pick-label" id="confirmPickLabel">멤버를 선택해주세요</div>
                            <button class="btn" id="confirmPickBtn" disabled onclick="onConfirmPick()">✅ 픽 확정</button>
                        </div>
                    </div>

                    <!-- 픽 가능한 멤버 -->
                    <div class="card">
                        <div class="section-title">📋 픽 가능한 멤버</div>
                        <div id="membersGrid" class="members-grid"></div>
                    </div>

                    <!-- 내 팀 (단계 O-3 fix #1: 왼쪽으로 이동) -->
                    <div class="card">
                        <div class="section-title" id="myTeamHeader">🏆 내 팀</div>
                        <div id="myTeamBox"></div>
                    </div>
                </div>

                <!-- 오른쪽: 상대 팀들 (2팀이면 1개, N팀이면 N-1개) -->
                <div class="split-grid-right">
                    <div class="card">
                        <div class="section-title" id="otherTeamHeader">🤝 상대 팀</div>
                        <div id="otherTeamBox"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase + 공통 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>

    <script>
    // ========================================================================
    // draft.html 로직
    // ========================================================================
    // 단계 O-2: N팀 (2/4/6/8) 호환 픽 로직
    //   - 2팀: 1-2-2-2-1 (8픽) - 기존 흐름
    //   - 4팀+: 스네이크 1-2-3-..-N-N-...-2-1 반복 (4 라운드, N팀*4픽)
    // ========================================================================

    let currentRoom = null;
    let currentDrafts = [];
    let currentTeams = [];   // N팀: teams 테이블 캐시
    let isProcessing = false;

    // 단계 E 변경: 후보 멤버 목록 (배열, 1명 또는 2명. 본인 연속 픽 수에 따라)
    let pendingPicks = [];

    // 단계 O-2: 동적 픽 시퀀스 계산
    // 2팀: ['A','B','B','A','A','B','B','A'] (A=먼저픽, B=나중픽)
    // N팀: [1,2,3,...,N, N,...,3,2,1, 1,2,3,...,N, N,...,3,2,1] (team_index 배열)
    function _buildPickSequence() {
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            // 2팀 — 기존 1-2-2-2-1 패턴 + pick_order 매핑
            const pickerA = currentRoom.pick_order;
            const pickerB = pickerA === 'leader1' ? 'leader2' : 'leader1';
            return ['A', 'B', 'B', 'A', 'A', 'B', 'B', 'A'].map(s => s === 'A' ? pickerA : pickerB);
        }
        // N팀 스네이크: 4 라운드, 각 라운드 N픽
        // 1라운드: pos 1,2,...,N
        // 2라운드: pos N,N-1,...,1
        // 3라운드: pos 1,2,...,N
        // 4라운드: pos N,N-1,...,1
        // pos → team_index (teams 테이블의 pick_position 매핑)
        const posToTeamIdx = {};
        currentTeams.forEach(t => {
            if (t.pick_position) posToTeamIdx[t.pick_position] = t.team_index;
        });
        const seq = [];
        for (let round = 1; round <= 4; round++) {
            const ascending = (round % 2 === 1);
            for (let p = 1; p <= teamCount; p++) {
                const pos = ascending ? p : (teamCount - p + 1);
                seq.push(posToTeamIdx[pos] || null);
            }
        }
        return seq;
    }

    function _getTotalPicks() {
        return (currentRoom.team_count || 2) * 4;
    }

    function _getMyPickerToken() {
        // 2팀: ROLE ('leader1'/'leader2'). N팀: team_index (1..8)
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) return ROLE;
        return getMyTeamIndex();
    }

    function _isMyTurnNow() {
        const pickCount = currentDrafts.length;
        if (pickCount >= _getTotalPicks()) return false;
        const seq = _buildPickSequence();
        const expected = seq[pickCount];
        return expected === _getMyPickerToken();
    }

    // 본인 차례에서 연속으로 픽할 수 있는 수
    function _getMyAllowedPicks() {
        const pickCount = currentDrafts.length;
        const total = _getTotalPicks();
        if (pickCount >= total) return 0;
        const seq = _buildPickSequence();
        const myToken = _getMyPickerToken();
        let count = 0;
        for (let i = pickCount; i < total; i++) {
            if (seq[i] !== myToken) break;
            count++;
        }
        return count;
    }

    (async function init() {
        const v = validateUrlParams();
        if (!v.ok) { showFatalError(v.message); return; }

        if (!initSupabase()) {
            showFatalError('서버 연결 실패. (Supabase 설정 확인 필요)');
            return;
        }

        currentRoom = await validateAndLoadRoom();
        if (!currentRoom) {
            showFatalError('존재하지 않거나 만료된 방이거나, 인증 정보가 잘못되었습니다.');
            return;
        }

        // 단계 O: N팀 모드면 teams 캐시 미리 로드
        if (currentRoom.team_count && currentRoom.team_count > 0) {
            try {
                const _c = initSupabase();
                const { data: _teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                if (_teams) setTeamsCache(_teams);
            } catch (e) { console.warn('teams load failed:', e); }
        }

        // 단계 L: 팀장 잠금 — "본인이 맞으십니까?" 확인 + claim
        const claimed = await ensureLeaderClaim(currentRoom);
        if (!claimed) return;  // 거부 시 ensureLeaderClaim이 화면 교체함

        // 상태 검증 — drafting이 아니면 main으로 (라우팅이 알아서 처리)
        if (currentRoom.status !== 'drafting') {
            goToMain();
            return;
        }

        // 단계 O-2: N팀에선 currentRoom.pick_order가 없음. 대신 teams.pick_position 사용.
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            // 2팀: 기존대로 pick_order 확인
            if (!currentRoom.pick_order) {
                goToMain();
                return;
            }
        } else {
            // N팀: teams 테이블 로드 (pick_position 확인)
            try {
                const _c = initSupabase();
                const { data: teams } = await _c
                    .from('teams')
                    .select('*')
                    .eq('room_code', currentRoom.room_code)
                    .order('team_index');
                currentTeams = teams || [];
                setTeamsCache(currentTeams);
                // 모든 팀의 pick_position이 정해졌는지
                const allHavePos = currentTeams.length === teamCount
                    && currentTeams.every(t => t.pick_position);
                if (!allHavePos) {
                    goToMain();
                    return;
                }
            } catch (e) {
                showFatalError('팀 정보 로드 실패: ' + (e && e.message ? e.message : e));
                return;
            }
        }

        // 드래프트 픽 로드
        currentDrafts = await loadDrafts();

        // 헤더
        const totalPicks = teamCount * 4;
        const seqLabel = teamCount === 2 ? '1-2-2-2-1' : (teamCount + '팀 스네이크');
        renderHeader(currentRoom,
            '⚔️ STEP 2: 드래프트 진행',
            `${seqLabel} 순서로 ${totalPicks}픽 진행합니다.`
        );

        // 실시간 구독
        subscribeRealtime({
            onRoom: (payload) => {
                if (payload.eventType === 'DELETE') {
                    showFatalError('관리자가 방을 닫았습니다.');
                    return;
                }
                currentRoom = payload.new;
                // 다음 단계로 넘어갔으면 라우팅
                if (currentRoom.status === 'rps2') {
                    goToRps(2);
                } else if (currentRoom.status === 'done') {
                    goToDone();
                } else if (currentRoom.status === 'matchup_pending') {
                    // 단계 O-2: N팀 — 모든 픽 끝나면 매칭 결정 대기 화면으로
                    goToMain();
                } else if (currentRoom.status === 'side_rps') {
                    // 단계 O-2: N팀 — 매칭 결정 끝, 진영 가위바위보 페이지로
                    goToSide();
                }
            },
            onDraft: async () => {
                currentDrafts = await loadDrafts();
                renderDraft();
            }
        });

        hide('loadingView');
        show('draftView');
        renderDraft();
    })();

    // ========================================================================
    // 단계 E 변경: 다중 후보 선택 (1-2명 차례에 맞게)
    // ========================================================================
    function onMemberSelect(memberName) {
        if (!_isMyTurnNow()) return;
        const pickedMap = _buildPickedMap();
        if (pickedMap[memberName]) return;

        const allowed = _getMyAllowedPicks();
        const idx = pendingPicks.indexOf(memberName);

        if (idx !== -1) {
            // 이미 선택된 멤버 → 해제
            pendingPicks.splice(idx, 1);
        } else if (pendingPicks.length < allowed) {
            // 새로 추가
            pendingPicks.push(memberName);
        } else {
            showToast(`이번 차례는 ${allowed}명까지만 선택 가능합니다.\n다른 선택을 해제하고 골라주세요.`);
            return;
        }
        renderDraft();
    }

    // ========================================================================
    // 단계 E: [확정] 버튼 — 선택한 멤버들을 순서대로 RPC 호출
    // ========================================================================
    async function onConfirmPick() {
        if (isProcessing) return;
        if (pendingPicks.length === 0) return;
        if (!_isMyTurnNow()) return;

        // 이중 확인: 후보들이 그 사이에 이미 픽됐는지
        const pickedMap = _buildPickedMap();
        const stillAvailable = pendingPicks.filter(m => !pickedMap[m]);
        if (stillAvailable.length < pendingPicks.length) {
            showToast('일부 멤버가 이미 픽되었습니다. 다시 선택해주세요.');
            pendingPicks = stillAvailable;
            renderDraft();
            return;
        }

        isProcessing = true;
        const btn = $('confirmPickBtn');
        if (btn) { btn.disabled = true; btn.innerText = '⏳ 확정 중...'; }

        const toSubmit = [...pendingPicks];
        let successCount = 0;

        try {
            const client = initSupabase();
            // 단계 O-2: team_count에 따라 RPC 분기
            const rpcName = (currentRoom.team_count && currentRoom.team_count > 2)
                ? 'make_team_draft_pick' : 'make_draft_pick';
            for (let i = 0; i < toSubmit.length; i++) {
                const m = toSubmit[i];
                const { data, error } = await client.rpc(rpcName, {
                    p_room_code: ROOM_CODE,
                    p_leader_token: TOKEN,
                    p_member_name: m
                });
                if (error) {
                    showToast('오류: ' + error.message);
                    break;
                }
                if (data && data[0] && !data[0].success) {
                    showToast(data[0].message || '픽 실패');
                    break;
                }
                successCount++;
            }
        } catch (e) {
            showToast('네트워크 오류');
            console.error(e);
        }

        if (successCount > 0) {
            const submittedNames = toSubmit.slice(0, successCount).join(', ');
            showToast(submittedNames + ' 픽 완료!');
        }
        pendingPicks = [];
        currentDrafts = await loadDrafts();
        isProcessing = false;
        const btn2 = $('confirmPickBtn');
        if (btn2) btn2.innerText = '✅ 픽 확정';
        renderDraft();
    }

    // ── 단계 E 헬퍼들 ───────────────────────────────────────────────────────
    function _buildPickedMap() {
        const map = {};
        currentDrafts.forEach(d => { map[d.picked_member] = d.picker; });
        return map;
    }
    // _isMyTurnNow, _getMyAllowedPicks 는 위에서 정의됨 (단계 O-2 N팀 호환)

    // ========================================================================
    // 렌더링
    // ========================================================================
    function renderDraft() {
        const pickCount = currentDrafts.length;
        const nextPickNumber = pickCount + 1;
        const totalPicks = _getTotalPicks();
        const seq = _buildPickSequence();

        // 다음 픽 차례 (token: 2팀='leader1'/'leader2', N팀=team_index)
        let expectedPicker = null;
        if (pickCount < totalPicks) {
            expectedPicker = seq[pickCount];
        }
        const isMyTurn = (expectedPicker === _getMyPickerToken());
        const isDone = pickCount >= totalPicks;

        // 단계 E: pendingPicks 중 invalid한 항목 자동 제거
        if (pendingPicks.length > 0) {
            const pickedMap = _buildPickedMap();
            if (!isMyTurn) {
                pendingPicks = [];
            } else {
                pendingPicks = pendingPicks.filter(m => !pickedMap[m]);
            }
        }

        // 상태 박스
        const statusBox = $('draftStatusBox');
        const currentText = $('currentText');
        if (isDone) {
            statusBox.className = 'draft-status done';
            currentText.innerText = '✅ 드래프트 완료! 다음 단계로 이동 중...';
        } else if (isMyTurn) {
            statusBox.className = 'draft-status my-turn';
            currentText.innerText = `🔥 내 차례! (${nextPickNumber}픽 / 총 ${totalPicks}픽)`;
        } else {
            statusBox.className = 'draft-status';
            const otherName = _getDisplayNameForToken(expectedPicker);
            currentText.innerText = `⏳ ${otherName}의 차례 (${nextPickNumber}픽 / 총 ${totalPicks}픽)`;
        }

        // 진행 슬롯
        renderProgress(pickCount, seq);

        // 멤버 그리드
        renderMembers(isMyTurn);

        // 단계 D 추가: 확정 영역 갱신
        renderConfirmArea(isMyTurn);

        // 팀 구성
        renderTeams();
    }

    // 단계 O-2: token에 따른 표시 이름
    function _getDisplayNameForToken(token) {
        if (!token) return '?';
        // 2팀 ('leader1'/'leader2')
        if (token === 'leader1') return currentRoom.leader1_name || '팀장 1';
        if (token === 'leader2') return currentRoom.leader2_name || '팀장 2';
        // N팀 (team_index)
        if (typeof token === 'number') {
            const team = currentTeams.find(t => t.team_index === token);
            return team ? (team.leader_name || ('팀장 ' + token)) : ('팀장 ' + token);
        }
        return String(token);
    }

    // 단계 E: 확정 영역 갱신 (다중 픽 지원)
    function renderConfirmArea(isMyTurn) {
        const area = $('confirmPickArea');
        const label = $('confirmPickLabel');
        const btn = $('confirmPickBtn');
        if (!area || !label || !btn) return;

        if (!isMyTurn) {
            area.style.display = 'none';
            return;
        }

        area.style.display = 'block';
        const allowed = _getMyAllowedPicks();

        if (pendingPicks.length === 0) {
            const hint = allowed > 1 ? `${allowed}명 동시 선택 가능` : '';
            label.innerText = `💡 멤버를 선택한 뒤 [픽 확정]을 눌러주세요${hint ? ' (' + hint + ')' : ''}`;
            btn.disabled = true;
        } else {
            const escapedNames = pendingPicks.map(escapeHtml).join(', ');
            label.innerHTML = `선택한 멤버 (${pendingPicks.length}/${allowed}): <span class="pick-name">${escapedNames}</span>`;
            btn.disabled = isProcessing;
        }
    }

    function renderProgress(pickCount, seq) {
        const html = [];
        const totalPicks = _getTotalPicks();
        for (let i = 0; i < totalPicks; i++) {
            const owner = seq[i]; // 2팀: 'leader1'/'leader2', N팀: team_index (1..8)
            const done = i < pickCount;
            const current = i === pickCount;

            let cls = 'pick-slot';
            // 단계 O-2: 2팀은 기존 클래스 ('leader1'/'leader2'), N팀은 'team-N'
            const ownerClass = (typeof owner === 'number') ? ('team-' + owner) : owner;
            if (done) {
                cls += ` done ${ownerClass}`;
            } else if (current) {
                cls += ' current';
            }

            // 라벨: 어느 팀이 픽하는지 표시
            let actualTeam;
            if (typeof owner === 'number') {
                actualTeam = owner + '팀';
            } else {
                actualTeam = owner === 'leader1' ? '1팀' : '2팀';
            }

            html.push(`
                <div class="pick-slot-wrap">
                    <div class="${cls}">${i + 1}</div>
                    <div class="pick-slot-label">${actualTeam}</div>
                </div>
            `);
        }
        $('draftProgress').innerHTML = html.join('');
    }

    function renderMembers(isMyTurn) {
        const members = currentRoom.members || [];
        const pickedMap = {};
        currentDrafts.forEach(d => { pickedMap[d.picked_member] = d.picker; });
        // 단계 O-2: picker_team_index 매핑도 함께
        const pickedTeamMap = {};
        currentDrafts.forEach(d => { pickedTeamMap[d.picked_member] = d.picker_team_index; });

        const teamCount = currentRoom.team_count || 2;
        const isNTeam = teamCount > 2;
        const myName = getMyDisplayName(currentRoom);

        // 단계 O-2: 팀장 이름 집합 (2팀+N팀 모두 호환)
        const leaderNameToTeamIdx = {};
        if (isNTeam) {
            currentTeams.forEach(t => { leaderNameToTeamIdx[t.leader_name] = t.team_index; });
        } else {
            leaderNameToTeamIdx[currentRoom.leader1_name] = 1;
            leaderNameToTeamIdx[currentRoom.leader2_name] = 2;
        }

        const grid = $('membersGrid');
        grid.innerHTML = '';

        // 단계 O-3 (fix #3): 픽된 멤버 + 팀장은 왼쪽 그리드에서 제외 (오른쪽 팀 박스에서 볼 수 있음)
        const visibleMembers = members.filter(rawM => {
            const memberName = (rawM && typeof rawM === 'object') ? (rawM.name || '') : String(rawM);
            if (!memberName) return false;
            if (leaderNameToTeamIdx[memberName] !== undefined) return false; // 팀장 제외
            if (pickedMap[memberName]) return false; // 이미 픽된 멤버 제외
            return true;
        });

        if (visibleMembers.length === 0) {
            grid.innerHTML = `<div style="text-align:center; color:#6b7280; padding:30px 12px; font-size:13px;">
                모든 멤버가 픽되었습니다.<br>
                <span style="color:#9ca3af; font-size:11px;">다음 단계를 기다려주세요.</span>
            </div>`;
            return;
        }

        // 단계 I: members가 객체 배열 {name, score}
        visibleMembers.forEach(rawM => {
            const memberName = (rawM && typeof rawM === 'object') ? (rawM.name || '') : String(rawM);
            const memberScore = (rawM && typeof rawM === 'object') ? rawM.score : null;

            const btn = document.createElement('button');
            btn.className = 'member-btn';
            btn.type = 'button';

            // 점수 뱃지 HTML
            const scoreHtml = (memberScore !== null && memberScore !== undefined && memberScore !== '')
                ? `<span class="member-score-badge">${memberScore}</span>` : '';

            if (isMyTurn) {
                btn.innerHTML = `<span class="member-name-wrap">${escapeHtml(memberName)}${scoreHtml}</span>`;
                const orderIdx = pendingPicks.indexOf(memberName);
                if (orderIdx !== -1) {
                    btn.classList.add('is-selected');
                    const badge = document.createElement('span');
                    badge.className = 'selected-badge';
                    badge.innerText = _getMyAllowedPicks() > 1 ? String(orderIdx + 1) : '✓';
                    btn.appendChild(badge);
                }
                btn.onclick = () => onMemberSelect(memberName);
            } else {
                btn.innerHTML = `<span class="member-name-wrap">${escapeHtml(memberName)}${scoreHtml}</span>`;
                btn.disabled = true;
            }
            grid.appendChild(btn);
        });
    }

    // 단계 E: 새 레이아웃 — 내 팀 (위) / 상대 팀 (아래)
    // 단계 O-2: N팀이면 split-grid-right를 N팀 그리드로 완전 교체
    function renderTeams() {
        const teamCount = currentRoom.team_count || 2;
        if (teamCount === 2) {
            renderTeams2();
        } else {
            renderTeamsN();
        }
    }

    function renderTeams2() {
        // 기존 2팀 흐름 — myTeamBox(왼쪽), otherTeamBox(오른쪽)
        const myTeamLabel = ROLE === 'leader1' ? '1팀' : '2팀';
        const otherTeamLabel = ROLE === 'leader1' ? '2팀' : '1팀';
        const myLeaderName = ROLE === 'leader1' ? currentRoom.leader1_name : currentRoom.leader2_name;
        const otherLeaderName = ROLE === 'leader1' ? currentRoom.leader2_name : currentRoom.leader1_name;
        const myLeaderScore = ROLE === 'leader1' ? currentRoom.leader1_score : currentRoom.leader2_score;
        const otherLeaderScore = ROLE === 'leader1' ? currentRoom.leader2_score : currentRoom.leader1_score;
        const myRole = ROLE;
        const otherRole = ROLE === 'leader1' ? 'leader2' : 'leader1';

        const myPicks = currentDrafts.filter(d => d.picker === myRole).map(d => d.picked_member);
        const otherPicks = currentDrafts.filter(d => d.picker === otherRole).map(d => d.picked_member);

        // 단계 O-3 fix #1: 오른쪽 컨테이너를 기본 (2팀) 형태로 복원
        _ensureRightContainerDefault();

        $('myTeamHeader').innerText = `🏆 내 팀 (${myTeamLabel}) — ${1 + myPicks.length}명`;
        $('otherTeamHeader').innerText = `🤝 상대 팀 (${otherTeamLabel}) — ${1 + otherPicks.length}명`;

        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) scoreMap[m.name] = m.score;
        });

        const scoreBadge = (sc) => (sc !== null && sc !== undefined && sc !== '')
            ? `<span class="member-score-badge">${sc}</span>` : '';

        const buildBox = (leaderName, leaderScore, picks) => {
            let html = `<div class="team-vbox-row leader"><span>👑 ${escapeHtml(leaderName || '(미정)')}</span>${scoreBadge(leaderScore)}</div>`;
            for (let i = 0; i < 4; i++) {
                if (i < picks.length) {
                    const sc = scoreMap[picks[i]];
                    html += `<div class="team-vbox-row"><span>${escapeHtml(picks[i])}</span>${scoreBadge(sc)}</div>`;
                } else {
                    html += `<div class="team-vbox-row empty">(픽 대기)</div>`;
                }
            }
            return html;
        };

        $('myTeamBox').innerHTML = buildBox(myLeaderName, myLeaderScore, myPicks);
        $('otherTeamBox').innerHTML = buildBox(otherLeaderName, otherLeaderScore, otherPicks);
    }

    function _ensureRightContainerDefault() {
        // 오른쪽 컨테이너에 otherTeamBox가 있는지 확인 (N팀 후 2팀으로 돌아가는 경우 등)
        const right = document.querySelector('.split-grid-right');
        if (!right) return;
        if (!$('otherTeamBox')) {
            right.innerHTML = `
                <div class="card">
                    <div class="section-title" id="otherTeamHeader">🤝 상대 팀</div>
                    <div id="otherTeamBox"></div>
                </div>
            `;
        }
    }

    function renderTeamsN() {
        // 단계 O-3 fix #1: 내 팀은 왼쪽 myTeamBox, 상대 팀들은 오른쪽 그리드
        const teamCount = currentRoom.team_count;
        const myIdx = getMyTeamIndex();

        // members 점수 맵
        const members = Array.isArray(currentRoom.members) ? currentRoom.members : [];
        const scoreMap = {};
        members.forEach(m => {
            if (m && typeof m === 'object' && m.name) scoreMap[m.name] = m.score;
        });
        currentTeams.forEach(t => { if (t.leader_name) scoreMap[t.leader_name] = t.leader_score; });

        const scoreBadge = (sc) => (sc !== null && sc !== undefined && sc !== '')
            ? `<span class="member-score-badge">${sc}</span>` : '';

        // 1) 왼쪽 내 팀 그리기 (기존 myTeamBox 사용)
        const myTeam = currentTeams.find(t => t.team_index === myIdx);
        if (myTeam) {
            const myPicks = currentDrafts.filter(d => d.picker_team_index === myIdx)
                                          .sort((a, b) => a.pick_number - b.pick_number);
            const myTotal = (myTeam.leader_score || 0) + myPicks.reduce((s, p) => s + (Number(scoreMap[p.picked_member]) || 0), 0);
            $('myTeamHeader').innerText = `🏆 내 팀 (${myIdx}팀) — ${1 + myPicks.length}명 / 합산 ${myTotal}점`;
            let html = `<div class="team-vbox-row leader"><span>👑 ${escapeHtml(myTeam.leader_name || '(미정)')}</span>${scoreBadge(myTeam.leader_score)}</div>`;
            for (let i = 0; i < 4; i++) {
                if (i < myPicks.length) {
                    html += `<div class="team-vbox-row"><span>${escapeHtml(myPicks[i].picked_member)}</span>${scoreBadge(scoreMap[myPicks[i].picked_member])}</div>`;
                } else {
                    html += `<div class="team-vbox-row empty">(픽 대기)</div>`;
                }
            }
            if ($('myTeamBox')) $('myTeamBox').innerHTML = html;
        }

        // 2) 오른쪽 상대 팀들 그리기 (그리드)
        const right = document.querySelector('.split-grid-right');
        if (!right) return;

        const otherTeams = currentTeams.filter(t => t.team_index !== myIdx);
        // 그리드 컬럼 수: 상대 1팀=1, 3팀=1(세로), 5팀=2, 7팀=2
        let gridCols = '1fr';
        if (otherTeams.length >= 5) gridCols = '1fr 1fr';
        else if (otherTeams.length >= 3) gridCols = '1fr';

        right.innerHTML = `
            <div class="card" style="padding:10px;">
                <div class="section-title" style="text-align:center; margin-bottom:8px;">
                    🤝 상대 팀 (${otherTeams.length}팀)
                </div>
                <div id="otherTeamsGridContainer" style="display:grid; grid-template-columns:${gridCols}; gap:6px;"></div>
            </div>
        `;
        const container = document.getElementById('otherTeamsGridContainer');

        otherTeams.forEach(t => {
            const picks = currentDrafts.filter(d => d.picker_team_index === t.team_index)
                                       .sort((a, b) => a.pick_number - b.pick_number);
            const total = (t.leader_score || 0) + picks.reduce((s, p) => s + (Number(scoreMap[p.picked_member]) || 0), 0);

            let rowsHtml = `<div class="team-vbox-row leader" style="font-size:11px; padding:4px 6px;">
                <span>👑 ${escapeHtml(t.leader_name || '?')}</span>${scoreBadge(t.leader_score)}
            </div>`;
            for (let i = 0; i < 4; i++) {
                if (i < picks.length) {
                    rowsHtml += `<div class="team-vbox-row" style="font-size:11px; padding:4px 6px;">
                        <span>${escapeHtml(picks[i].picked_member)}</span>${scoreBadge(scoreMap[picks[i].picked_member])}
                    </div>`;
                } else {
                    rowsHtml += `<div class="team-vbox-row empty" style="font-size:11px; padding:4px 6px;">(픽 대기)</div>`;
                }
            }
            const box = document.createElement('div');
            box.style.cssText = 'border:1px solid #e5e7eb; background:#fff; border-radius:8px; padding:6px;';
            box.innerHTML = `<div style="font-size:11px; font-weight:800; text-align:center; margin-bottom:4px; padding-bottom:3px; border-bottom:1px dashed rgba(0,0,0,0.1); color:#1f2937;">
                ${t.team_index}팀 <span style="font-size:9px; color:#6b7280; font-weight:700;">(${total}점, ${1 + picks.length}명)</span>
            </div>${rowsHtml}`;
            container.appendChild(box);
        });
    }
    </script>
</body>
</html>
