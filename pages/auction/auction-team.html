<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경매 - 롤다방 내전 드래프트</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../draft-common.css">
    <style>
        .auction-status-card {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 20px 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            text-align: center;
            border: 2px solid #f59e0b;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
        }
        .auction-status-card.waiting {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            border-color: #9ca3af;
        }
        .auction-status-card.sold {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: #10b981;
        }
        .auction-status-title {
            font-size: 14px;
            color: #92400e;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .auction-status-card.waiting .auction-status-title { color: #6b7280; }
        .auction-status-card.sold .auction-status-title { color: #065f46; }
        .auction-member-name {
            font-size: 26px;
            font-weight: 800;
            color: #1f2937;
            margin: 8px 0;
        }
        .auction-member-score {
            display: inline-block;
            background: #6366f1;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 12px;
            margin: 4px 0;
        }
        .auction-current-bid {
            background: rgba(255,255,255,0.6);
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
        }
        .auction-current-bid-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 700;
        }
        .auction-current-bid-amount {
            font-size: 32px;
            font-weight: 800;
            color: #dc2626;
            margin: 4px 0;
        }
        .auction-current-bidder {
            font-size: 13px;
            color: #4b5563;
            font-weight: 700;
        }
        .auction-current-bidder.mine {
            color: #059669;
            font-weight: 800;
        }
        .auction-timer {
            display: inline-block;
            font-size: 14px;
            font-weight: 800;
            color: #dc2626;
            background: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            margin-top: 8px;
            border: 2px solid #fca5a5;
        }
        .auction-timer.warning {
            animation: blinkTimer 0.5s ease-in-out infinite;
            background: #fef2f2;
        }
        @keyframes blinkTimer {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 내 정보 */
        .my-info-card {
            background: #fff;
            border: 2px solid #6366f1;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }
        .my-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .my-info-row strong { color: #4338ca; }
        .my-info-row.points {
            font-size: 18px;
            font-weight: 800;
            color: #059669;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e0e7ff;
        }

        /* 입찰 버튼 영역 */
        .bid-area {
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
        }
        .bid-area.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .bid-area-title {
            font-size: 14px;
            font-weight: 800;
            color: #1f2937;
            margin-bottom: 10px;
            text-align: center;
        }
        .bid-quick-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .bid-quick-btn {
            padding: 14px 0;
            font-size: 16px;
            font-weight: 800;
            border: 2px solid #6366f1;
            background: #fff;
            color: #4338ca;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Pretendard', sans-serif;
        }
        .bid-quick-btn:hover:not(:disabled) {
            background: #6366f1;
            color: #fff;
            transform: translateY(-1px);
        }
        .bid-quick-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .bid-custom-row {
            display: flex;
            gap: 8px;
        }
        .bid-custom-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Pretendard', sans-serif;
            text-align: center;
            outline: none;
        }
        .bid-custom-input:focus { border-color: #6366f1; }
        .bid-custom-btn {
            padding: 12px 18px;
            background: #4338ca;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
        }
        .bid-custom-btn:hover { background: #3730a3; }
        .bid-custom-btn:disabled { background: #9ca3af; cursor: not-allowed; }

        /* 다른 팀 / 낙찰 결과 */
        .other-teams-card {
            margin-top: 14px;
        }
        .other-team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
        }
        .other-team-row.my-team {
            background: #ede9fe;
            border: 1px solid #c4b5fd;
        }
        .other-team-name { font-weight: 700; }
        .other-team-points {
            color: #059669;
            font-weight: 800;
        }

        .next-member-preview {
            font-size: 12px;
            color: #6b7280;
            margin-top: 10px;
            padding: 8px;
            background: #f3f4f6;
            border-radius: 6px;
            text-align: center;
        }
        .next-member-preview strong { color: #4338ca; }

        .auction-msg-area {
            margin-top: 12px;
            min-height: 24px;
            text-align: center;
        }
        .auction-msg {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .auction-msg.error { background: #fef2f2; color: #dc2626; }
        .auction-msg.success { background: #ecfdf5; color: #059669; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div id="leaderHeader" class="leader-header"></div>
        <div id="mainContent"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../draft-common.js"></script>
    <script src="../../auction-common.js"></script>
    <script>
        let currentRoom = null;
        let myTeam = null;          // teams 행 (내 팀)
        let allTeams = [];          // 모든 팀
        let auctionResults = [];    // 낙찰 결과
        let timerInterval = null;
        let realtimeSubs = [];

        async function init() {
            const client = initSupabase();
            if (!client) {
                $('mainContent').innerHTML = '<div class="card">Supabase 설정 오류</div>';
                return;
            }

            // 1. 방 로드
            const room = await loadRoom();
            if (!room) {
                $('mainContent').innerHTML = '<div class="card">방을 찾을 수 없습니다.</div>';
                return;
            }
            currentRoom = room;

            // 2. teams 로드
            const { data: teams } = await client
                .from('teams')
                .select('*')
                .eq('room_code', room.room_code)
                .order('team_index');
            allTeams = teams || [];

            // 3. 내 팀 찾기 — leader_token 매칭
            myTeam = allTeams.find(t => t.leader_token === TOKEN);
            if (!myTeam) {
                $('mainContent').innerHTML = '<div class="card">팀 정보를 찾을 수 없습니다.</div>';
                return;
            }

            // 단계 P-4: 팀장 확인 화면 — 처음 접속한 경우만
            const claimKey = 'loldabang_auctionClaim_' + currentRoom.room_code + '_' + myTeam.team_index;
            const alreadyConfirmed = localStorage.getItem(claimKey) === '1';
            if (!alreadyConfirmed) {
                const ok = await _showClaimConfirmScreen(myTeam.leader_name);
                if (!ok) {
                    document.body.innerHTML = `<div style="padding:60px; text-align:center; font-family:'Pretendard',sans-serif;">
                        <div style="font-size:48px; margin-bottom:16px;">⚠️</div>
                        <h2 style="font-size:18px; margin-bottom:10px; color:#dc2626;">접속이 거부되었습니다</h2>
                        <p style="font-size:13px; color:#6b7280;">본인이 아니라고 응답하셨습니다.<br>관리자에게 문의해주세요.</p>
                    </div>`;
                    return;
                }
                localStorage.setItem(claimKey, '1');
            }

            // 4. 낙찰 결과 로드 (auction-common.js)
            auctionResults = await loadAuctionResults(currentRoom.room_code);

            // 5. 헤더 표시
            renderHeader();

            // 6. 메인 렌더
            renderMain();

            // 7. Realtime 구독
            subscribeRealtime();

            // 8. 타이머 시작
            startTimer();
        }

        function renderHeader() {
            const header = $('leaderHeader');
            header.innerHTML = `<div class="leader-badge">
                👑 ${myTeam.team_index}팀 팀장 (${escapeHtml(myTeam.leader_name)})
            </div>
            <div class="step-badge">⚔️ STEP: 경매 진행</div>`;
        }

        function renderMain() {
            const content = $('mainContent');
            const state = currentRoom.auction_state || 'waiting_for_call';

            let html = '';

            // 내 정보
            html += `<div class="my-info-card">
                <div class="my-info-row">
                    <span>팀장</span>
                    <strong>${escapeHtml(myTeam.leader_name)}</strong>
                </div>
                <div class="my-info-row">
                    <span>내 팀 멤버</span>
                    <strong>${countMyMembers()}명</strong>
                </div>
                <div class="my-info-row points">
                    <span>💰 남은 포인트</span>
                    <span>${myTeam.auction_points}</span>
                </div>
            </div>`;

            // 상태별 메인 카드
            if (state === 'waiting_for_call' || state === 'sold') {
                html += renderWaitingState();
            } else if (state === 'bidding') {
                html += renderBiddingState();
            } else if (state === 'done') {
                html += renderDoneState();
            }

            // 다른 팀 현황
            html += renderOtherTeams();

            content.innerHTML = html;

            // 이벤트 바인딩 (input enter)
            const customInput = document.getElementById('bidCustomInput');
            if (customInput) {
                customInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        placeBidCustom();
                    }
                });
            }
        }

        function renderWaitingState() {
            const showNext = currentRoom.auction_show_next_member && currentRoom.auction_next_member;
            let html = `<div class="auction-status-card waiting">
                <div class="auction-status-title">⏳ 다음 멤버 호출 대기 중</div>
                <p style="color: #6b7280; font-size: 13px; margin: 8px 0;">
                    관리자가 다음 멤버를 호출하면 입찰이 시작됩니다.
                </p>`;
            if (showNext) {
                html += `<div class="next-member-preview">
                    다음 호출 예정: <strong>${escapeHtml(currentRoom.auction_next_member)}</strong>
                </div>`;
            }
            html += `</div>`;
            return html;
        }

        function renderBiddingState() {
            const currentBid = currentRoom.current_bid_amount || 0;
            const currentBidder = currentRoom.current_bid_team_index;
            const isMyBid = currentBidder === myTeam.team_index;
            const myBidderClass = isMyBid ? 'mine' : '';
            const bidderName = currentBidder
                ? (allTeams.find(t => t.team_index === currentBidder)?.leader_name || `${currentBidder}팀`)
                : '없음';
            const bidderLabel = isMyBid ? '👑 (나)' : (currentBidder ? `${currentBidder}팀` : '');

            // 타이머 영역
            const timerSeconds = currentRoom.auction_timer_seconds || 10;

            let html = `<div class="auction-status-card">
                <div class="auction-status-title">🔥 입찰 진행 중!</div>
                <div class="auction-member-name">${escapeHtml(currentRoom.current_member_name || '')}</div>
                <div class="auction-member-score">점수 ${currentRoom.current_member_score || 0}</div>
                <div class="auction-current-bid">
                    <div class="auction-current-bid-label">현재 최고 입찰</div>
                    <div class="auction-current-bid-amount">${currentBid}</div>
                    <div class="auction-current-bidder ${myBidderClass}">
                        ${currentBidder ? '입찰자: ' + bidderLabel + ' (' + escapeHtml(bidderName) + ')' : '아직 입찰 없음'}
                    </div>
                </div>
                <div id="timerDisplay" class="auction-timer">⏱ ${timerSeconds}초</div>
            </div>`;

            // 입찰 영역
            const isDisabled = isMyBid;
            const disabledClass = isDisabled ? 'disabled' : '';
            const minBid = currentBid + 1;

            html += `<div class="bid-area ${disabledClass}" id="bidArea">
                <div class="bid-area-title">
                    ${isDisabled ? '✓ 현재 내가 최고 입찰자입니다' : `📢 입찰하기 (최소 ${minBid})`}
                </div>
                <div class="bid-quick-row">
                    <button class="bid-quick-btn" onclick="placeBidQuick(1)" ${isDisabled ? 'disabled' : ''}>+1</button>
                    <button class="bid-quick-btn" onclick="placeBidQuick(5)" ${isDisabled ? 'disabled' : ''}>+5</button>
                    <button class="bid-quick-btn" onclick="placeBidQuick(10)" ${isDisabled ? 'disabled' : ''}>+10</button>
                </div>
                <div class="bid-custom-row">
                    <input type="number" id="bidCustomInput" class="bid-custom-input" placeholder="금액 입력 (최소 ${minBid})" min="${minBid}">
                    <button class="bid-custom-btn" onclick="placeBidCustom()" ${isDisabled ? 'disabled' : ''}>입찰</button>
                </div>
                <div class="auction-msg-area" id="bidMsgArea"></div>
            </div>`;

            return html;
        }

        function renderDoneState() {
            return `<div class="auction-status-card sold">
                <div class="auction-status-title">🎉 경매 종료</div>
                <p style="color: #065f46; font-size: 14px; margin: 8px 0;">
                    모든 멤버의 경매가 끝났습니다.<br>
                    관리자가 결과를 정리 중입니다.
                </p>
            </div>`;
        }

        function renderOtherTeams() {
            let html = `<div class="card other-teams-card" style="padding: 12px;">
                <div style="font-size: 13px; font-weight: 800; color: #4338ca; margin-bottom: 8px;">📊 팀 현황</div>`;

            allTeams.forEach(t => {
                const isMyTeamRow = t.team_index === myTeam.team_index;
                const memCount = countTeamMembers(t.team_index);
                html += `<div class="other-team-row ${isMyTeamRow ? 'my-team' : ''}">
                    <span class="other-team-name">${t.team_index}팀 (${escapeHtml(t.leader_name)})</span>
                    <span>
                        <span style="color:#6b7280; font-size:12px;">${memCount + 1}명</span>
                        <span class="other-team-points" style="margin-left:8px;">💰 ${t.auction_points}</span>
                    </span>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        function countMyMembers() {
            return auctionResults.filter(r => r.team_index === myTeam.team_index).length;
        }
        function countTeamMembers(teamIdx) {
            return auctionResults.filter(r => r.team_index === teamIdx).length;
        }

        // ─── 입찰 ─────────────────────────────────────────────────────────────
        async function placeBidQuick(addAmount) {
            const currentBid = currentRoom.current_bid_amount || 0;
            const newAmount = currentBid + addAmount;
            await placeBid(newAmount);
        }
        async function placeBidCustom() {
            const inp = document.getElementById('bidCustomInput');
            if (!inp) return;
            const v = parseInt(inp.value, 10);
            if (isNaN(v) || v <= 0) {
                showBidMsg('올바른 금액을 입력해주세요', 'error');
                return;
            }
            await placeBid(v);
        }

        async function placeBid(amount) {
            showBidMsg('입찰 중...', 'success');
            const r = await placeAuctionBid(currentRoom.room_code, TOKEN, amount);
            if (!r.success) {
                showBidMsg(r.message || '입찰 실패', 'error');
                return;
            }
            showBidMsg('✅ 입찰 완료 (' + amount + ')', 'success');
            const inp = document.getElementById('bidCustomInput');
            if (inp) inp.value = '';
        }

        function showBidMsg(msg, type) {
            const area = document.getElementById('bidMsgArea');
            if (!area) return;
            area.innerHTML = `<span class="auction-msg ${type}">${escapeHtml(msg)}</span>`;
            setTimeout(() => { if (area) area.innerHTML = ''; }, 3000);
        }

        // ─── 타이머 ───────────────────────────────────────────────────────────
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => updateTimerDisplay(), 200);
        }
        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            if (!display || !currentRoom) return;
            if (currentRoom.auction_state !== 'bidding') return;

            const remaining = computeAuctionTimerRemaining(
                currentRoom.last_bid_at,
                currentRoom.auction_timer_seconds
            );
            display.innerText = '⏱ ' + remaining.toFixed(1) + '초';
            if (remaining <= 3) display.classList.add('warning');
            else display.classList.remove('warning');
        }

        // ─── Realtime 구독 ────────────────────────────────────────────────────
        function subscribeRealtime() {
            const client = initSupabase();
            // rooms — auction_state, current_bid 변경 감지
            const rcSub = client
                .channel('auction-room-' + currentRoom.room_code)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'rooms',
                    filter: `room_code=eq.${currentRoom.room_code}`
                }, async (payload) => {
                    currentRoom = payload.new;
                    // status가 done이거나 mode가 done이면 done.html로
                    if (currentRoom.status === 'done' && currentRoom.auction_state === 'done') {
                        goToDone();
                        return;
                    }
                    renderMain();
                })
                .subscribe();
            realtimeSubs.push(rcSub);

            // teams — auction_points 변경
            const teamSub = client
                .channel('auction-teams-' + currentRoom.room_code)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'teams',
                    filter: `room_code=eq.${currentRoom.room_code}`
                }, async (payload) => {
                    const updated = payload.new;
                    const idx = allTeams.findIndex(t => t.id === updated.id);
                    if (idx !== -1) allTeams[idx] = updated;
                    if (updated.team_index === myTeam.team_index) myTeam = updated;
                    renderMain();
                })
                .subscribe();
            realtimeSubs.push(teamSub);

            // auction_results — 낙찰 발생
            const resSub = client
                .channel('auction-results-' + currentRoom.room_code)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'auction_results',
                    filter: `room_code=eq.${currentRoom.room_code}`
                }, async (payload) => {
                    auctionResults.push(payload.new);
                    renderMain();
                })
                .subscribe();
            realtimeSubs.push(resSub);
        }

        function $(id) { return document.getElementById(id); }

        // 시작
        init();

        // 페이지 떠날 때 구독 해제
        window.addEventListener('beforeunload', () => {
            realtimeSubs.forEach(s => { try { s.unsubscribe(); } catch(e){} });
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
</body>
</html>
